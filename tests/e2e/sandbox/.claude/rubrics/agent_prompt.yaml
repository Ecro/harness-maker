  - id: output_format_specified
    description: >
      Is the output format explicit — schema, headers, bullet count, length cap?
      ('5 bullets, each under 15 words' beats 'be concise'.)
    severity: P1
    action: >
      Specify output format: bullet count, JSON schema, markdown headers,
      or length cap.
  - id: tools_scoped_minimally
    description: >
      Does the agent declare its tool needs in frontmatter, and is that
      scope minimal for its job (no overly broad Bash, no Write for read-only agents)?
    severity: P1
    action: >
      Restrict the agent's 'tools' frontmatter field to only what it needs.
      Reviewer agents should NOT have Write or Edit.
  - id: uncertainty_rule
    description: >
      Is there an explicit instruction for what to do when unsure (ask,
      flag, output 'unknown')? Claude responds well to 'don't guess'.
    severity: P2
    action: >
      Add a line: 'If unsure, say so explicitly and ask one clarifying question.'
  - id: examples_provided
    description: >
      Does the prompt include at least one good-output example (or
      reference to one) so the agent has a target to emulate?
    severity: P2
