- id: q_maker_owns_intents
  claim: A single front door that owns the intent and project-knowledge procedures
    (Maker reads them on demand; the skills are not model-invocable; unnamed goal/fact/status
    requests are routed to Maker by the always-loaded pointer, mid-stage included)
    lets a task's feedback reach the next decision without the operator re-instructing
    the connection.
