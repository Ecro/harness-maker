schema_version: 1
owners:
  owner: fixture-owner
  dri: fixture-dri
metrics:
- id: intent_world_closed_loop_cycles
  description: Consecutive real tasks whose feedback reaches the next decision without
    the user having to re-instruct the connection.
  target: 3
  higher_is_better: true
  how_measured: Review execution and conversation records for consecutive real tasks,
    tracing observations through world-state updates to the next decision and, when
    work remains within the agreed scope, the next execution. Count consecutive tasks
    meeting this criterion without the user having to re-instruct that connection;
    the target is three tasks, all successful. Normal approval or decision questions
    and evidence-backed termination on completion or goal attainment are not failures.
    The user makes the final assessment from the linked records. Record evidence with
    each measurement; document the task unit and observation window in the subsequent
    SPEC. The baseline is unmeasured; no result is asserted yet.
- id: task_lead_time_hours
  description: 최근 완료된 10개 task 의 첫 stage 시작부터 wrapup 종료까지 시간, 중앙값
  target: 6
  higher_is_better: false
  how_measured: 'stage-spans.jsonl: task_slug 별 첫 start → 짝지은 hm:wrapup end (6h 이내
    인접 end, 09-12 이전 end 는 slug null). task 크기에 좌우되므로 오름세를 곧바로 하네스 탓으로 읽지 말 것.'
  measure:
    cmd: uv run python -c "import json,statistics as st,datetime as d; P=lambda s:d.datetime.fromisoformat(s.replace('Z','+00:00'));
      R=[json.loads(l) for l in open('.claude/observability/stage-spans.jsonl')];
      F={}; [F.__setitem__(r['task_slug'],min(F.get(r['task_slug'],P(r['ts'])),P(r['ts'])))
      for r in R if r.get('task_slug')]; W=sorted((P(r['ts']),r['event'],r.get('task_slug'))
      for r in R if r['stage']=='hm:wrapup'); D={}; [D.setdefault(s,t2) for i,(t,e,s)
      in enumerate(W) if e=='start' and s for (t2,e2,s2) in W[i+1:i+2] if e2=='end'
      and s2 in (None,s) and (t2-t).total_seconds()<21600]; L=sorted(D,key=D.get)[-10:];
      print(round(st.median((D[s]-F[s]).total_seconds()/3600 for s in L),1))"
    select: last-number
    cwd: base
- id: change_failure_rate
  description: 결함 수리가 뒤따른 릴리스 태그 비율 (%, 28일 창)
  target: 10
  higher_is_better: false
  how_measured: 최신 delivery_metrics 스냅샷의 100 * cfr.failed / cfr.total. 스냅샷 갱신은 /hm:metrics
    (판정 필요, ~25분) — 7일보다 오래된 스냅샷이면 측정이 실패한다. 분모가 작아 태그 하나로 크게 움직인다.
  measure:
    cmd: uv run python -c "import json,subprocess,sys,datetime as d; s=json.loads(subprocess.run([sys.executable,'-m','harness_maker.delivery_metrics','trend','--root','.','--limit','1'],capture_output=True,text=True,check=True).stdout)['snapshots'][0];
      c=s['cfr']; a=(d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(s['ts'].replace('Z','+00:00'))).days;
      sys.exit(f'snapshot {a}d old - run /hm:metrics') if a>7 else sys.exit('cfr '+str(c['status']))
      if c['status']!='ok' else print(s['ts'], round(100*c['failed']/c['total'],1))"
    select: last-number
    cwd: base
- id: post_merge_churn
  description: 머지 후 14일 안에 다시 쓰인 추가 LOC 비율 (%)
  target: 12
  higher_is_better: false
  how_measured: 최신 delivery_metrics 스냅샷의 100 * churn.ratio. 14–28일 전에 머지된 코드를 본다 (성숙
    지연) — 지금 작업의 결과는 2주 뒤에 나타난다. 스냅샷 갱신은 /hm:metrics, 7일 초과면 측정 실패.
  measure:
    cmd: uv run python -c "import json,subprocess,sys,datetime as d; s=json.loads(subprocess.run([sys.executable,'-m','harness_maker.delivery_metrics','trend','--root','.','--limit','1'],capture_output=True,text=True,check=True).stdout)['snapshots'][0];
      h=s['churn']; a=(d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(s['ts'].replace('Z','+00:00'))).days;
      sys.exit(f'snapshot {a}d old - run /hm:metrics') if a>7 else sys.exit('churn
      '+str(h['status'])+(' partial' if h['partial'] else '')) if h['status']!='ok'
      or h['partial'] else print(s['ts'], round(100*h['ratio'],1))"
    select: last-number
    cwd: base
- id: unsourced_step_share
  description: 연구 근거 없이 이웃의 분류를 물려받은 step 비율 (%)
  target: 20
  higher_is_better: false
  how_measured: step_sensitivity.unsourced_count(REGISTRY) / len(REGISTRY)
  measure:
    cmd: uv run python -c "from harness_maker.step_sensitivity import REGISTRY as
      R, unsourced_count; print(round(100*unsourced_count(R)/len(R),1))"
    select: last-number
    cwd: checkout
- id: dead_rendered_bytes
  description: '트랜스크립트 창 안에서 호출 0회인 /hm: 명령의 렌더 바이트 비율 (%)'
  target: 10
  higher_is_better: false
  how_measured: economics stages 에서 turn 이 0 인 .claude/commands/hm/*.md 바이트 / 전체.
    호출 0회는 삭제 후보이지 무가치의 증명이 아니다.
  measure:
    cmd: uv run python -c "import json,sys,subprocess,pathlib; d=json.loads(subprocess.run([sys.executable,'-m','harness_maker.economics','stages','--root','.'],capture_output=True,text=True,check=True).stdout);
      u={s['stage'] for s in d['stages'] if s['turns']}; fs=list(pathlib.Path('.claude/commands/hm').glob('*.md'));
      t=sum(f.stat().st_size for f in fs); print(round(100*sum(f.stat().st_size for
      f in fs if 'hm:'+f.stem not in u)/t,1))"
    select: last-number
    cwd: base
- id: wiki_fact_entries_28d
  description: project-knowledge skill 출하 후 28일 창 안에 [wiki:fact] 로 기록된 주제 수
  target: 5
  higher_is_better: true
  how_measured: 'scripts/measure_wiki_fact_window.py (PLAN-mission-context-loop ADR-005).
    창은 그 skill 이 처음 들어간 가장 이른 v* 릴리스 tag 의 UTC 날짜부터 +28일까지(포함, UTC 날짜 단위). slug 마다
    git 이력과 working tree 를 통틀어 가장 이른 날짜로 센다. 창이 닫히기 전에는 측정하지 않는다 (not released → exit
    2, window open → exit 3). 판정은 사전 등록된 그대로 적용하고 발동 후 재해석하지 않는다: 5개 이상 → S1(주제별 파일)
    을 후보 task 로 등록, 0개 → project-knowledge skill 과 포인터 제거, 1–4개 → S0 유지. 창이 닫힌 뒤 첫
    /hm:wrapup 5.7 "Measure outcomes now?" 에서 운영자가 측정하고, 선택한 조치는 후속 task 의 RESEARCH/PLAN
    에 남긴다. 수동 S1–S3 확인은 일회용 clone 에서만 한다 (이 wiki 를 오염시키지 않도록).'
  measure:
    cmd: uv run python scripts/measure_wiki_fact_window.py
    select: last-number
    cwd: base
- id: understanding_handoff_rate
  description: 최근 wrapup 10건 중 사용자가 '이해 변화 요약만으로 diff 없이 변경을 설명할 수 있었고, 모르는 사이 내려진
    범위 밖 결정이 없었다'고 판정한 비율 (%)
  target: 80
  higher_is_better: true
  how_measured: 최근 /hm:wrapup 10건 각각을 사용자가 판정한다. (1) 완료 시 남은 이해 변화 요약 (바뀐 가정·불변조건·경계,
    아직 모르는 것) 만으로 diff 를 읽지 않고 변경을 설명할 수 있었는가, (2) 사용자 모르게 내려진 합의 범위 밖 WHY·WHAT 결정이
    없었는가. 둘 다 예인 건수 / 판정 건수 × 100. 요약 섹션이 존재한다는 것만으로는 통과하지 않는다. 각 측정에 판정한 wrapup 을
    근거로 남긴다. 요약 기능은 아직 없고 baseline 은 미측정이다 — 결과를 주장하지 않는다. 요약의 형식·위치·길이와 표본 단위는 후속
    SPEC 에서 정한다.
rules:
- 품질 하한(결정적 검증·리뷰 게이트)은 크기나 속도를 줄이는 대가로 낮추지 않는다
- TUNE 값은 재측정 없이 새 모델로 이전하지 않는다
- 사용자가 손댄 파일·hook·deny 규칙은 재렌더에서 보존한다
- render 는 결정적이다 — render 중 shell-out 없음
- Claude Code·Cursor·Codex 를 한 소스에서 렌더한다
- Python only, 텔레메트리 100% 로컬, 사용자 요청 없는 push 금지
- README를 포함한 사용자 대상 문서는 현재 최신 릴리스의 실제 동작과 항상 일치해야 한다. 각 릴리스에서 버전 표기, 설치법, 명령어와 옵션을
  검증한다
- AI 는 WHY·WHAT 을 제안할 수 있지만 조용히 소유하지 않는다. 합의된 범위를 벗어나는 결정은 사용자에게 묻고, 범위 안에서 AI 가 고른
  트레이드오프는 PLAN ADR 에 결정 주체(user|agent)와 함께 기록한다
out_of_scope:
- intent.yaml 내용의 LLM 자동 작성
- 도메인 콘텐츠(프레임워크 표준 등) 큐레이션 — 사용자가 쓴다
- Anthropic API 과금 경로 — 구독만
- 학습·코칭 모드(Challenge/Learn), 사용자 역량 평가, 팀 협업 기능 — 대상은 1인 시니어 개발자
purpose:
  statement: 프로젝트에 맞춘 개발 하네스로, 기본 품질을 지키면서 작업을 빠르고 효율적으로 완수하게 한다. HOW 는 AI 가 최대한 가져가고,
    WHY·WHAT·트레이드오프는 사람이 소유하며, 작업이 끝나면 코드와 함께 사람의 시스템 이해도 갱신되게 한다. 모델과 호스트의 발전을 빠르게
    측정해 반영하고, 제값을 못 하는 장치는 걷어낸다.
  vision: '사용자가 의도와 필요한 결정만 주면, 합의된 범위와 권한 안에서 /hm: 가 단계별 지시 없이 작업을 검증된 완료까지 이끈다.
    사용자에게 오는 질문은 WHY·WHAT·되돌리기 어려운 트레이드오프로 한정된다. 완료 시점에 사용자는 diff 를 읽지 않고도 시스템의 가정·불변조건·경계가
    어떻게 바뀌었는지, 무엇이 아직 모르는 채로 남았는지 설명할 수 있다. 각 프로젝트에는 필요한 구성만 렌더되고, 모델·호스트가 대체한 장치는
    검증을 거쳐 제거된다.'
