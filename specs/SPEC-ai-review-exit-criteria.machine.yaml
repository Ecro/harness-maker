mutation_threshold_rationale: "85 because that is what the T1 gate actually enforces. Measured, not assumed: with this field set to 70 the gate still enforced 85, so `mutation_threshold` is descriptive on the T1 path, not operative. (The accompanying 'score 0%' was NOT evidence of anything about the tests — it was a broken wrapper run; see mutation_runner_faults in spec_mutation. Corrected 2026-08-15.) Set to the enforced value rather than left disagreeing with it — a knob whose value the runtime ignores is the recurring dead-config class this repository records. The gate covers every Python verifier this SPEC ships (AC-015); the Jinja templates are unreachable by mutation and are covered by the RED gate instead (follow-up F1)."
