irreversible_decisions:
- id: IRR-001
  decision: Add five generated files under .claude/hm/ (wrapup-steps.md, verify-checks.md,
    review-autofix.md, review-confirmation.md, execute-a5.md) whose names the commands and
    stage-delegate read
  category: schema/file format/storage layout
  rationale: Renaming one later needs a retire step for copies on disk and breaks a harness
    whose command and file came from different versions
  source: spec
- id: IRR-002
  decision: stage-delegate follows <base_root>/.claude/hm/wrapup-steps.md and verify-checks.md
    as instructions; every other file it reads stays data
  category: security/permission boundary
  rationale: Its prompt said nothing read from disk could extend its instructions; a writer
    of the base checkout's .claude/hm/ can now direct the delegate, the same reach they already
    have over the command files
  source: spec
