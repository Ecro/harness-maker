- id: AC-004
  title: fingerprint is whitespace-invariant and token-sensitive
  type: property
  test_ids:
  - tests/unit/test_world_evidence_locator.py::test_ac_004_fingerprint_whitespace_invariant
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: The relation follows from the Constraints definition of normalization
    (whitespace runs collapse, empty lines drop) and holds for any text regardless
    of how fingerprinting is implemented; the token-change half is its converse.
  oracle_independence_waiver: null
  input_domain: lists of lines of printable text, including leading/trailing spaces,
    tabs, CRLF endings and blank lines
  transformation: apply a whitespace-only perturbation (reindent, trailing spaces,
    CRLF, insert blank lines) vs a non-whitespace edit
  expected_relation: fp(perturb_ws(x)) == fp(x) and fp(edit_token(x)) != fp(x)
  preconditions:
  - x contains at least one non-whitespace character
  observable_output: lowercase hex sha256 string
  generator_hint: hypothesis text strategy over a small alphabet plus whitespace
