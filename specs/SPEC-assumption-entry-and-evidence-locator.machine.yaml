mutation_threshold_rationale: 'Tier-1: add is the only entry to the assumption record
  that depends_on and revisit_when reference, and the fingerprint/relocation logic
  decides whether a stale citation is reported at all. A surviving mutant in normalization
  silently reports changed code as fresh; one in the authoritative-evidence selection
  keeps a cleared assumption stale forever. Scope is world.py and evidence_locator.py.'
