- id: AC-008
  title: concurrent writers keep both rows
  type: mechanical
  test_ids:
  - tests/integration/test_world_assume_concurrency.py::test_ac_008_concurrent_writers_keep_both_rows
  executable_predicate: held_bytes_unchanged and write_landed_after_release and all({'a','b'}
    <= ids_after(run) for run in add_add_runs) and all(evidence_delta(run) == 1 for
    run in add_observe_runs)
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: The held-lock arm waits for a positive contention signal (the writer's
    first retry) before comparing bytes, so an unlocked writer fails it; the race
    arms expect exactly what the processes were told to write, independent of the
    lock code.
