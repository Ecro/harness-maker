  judgment_evidence: 'judgment-reviewer against the agent_prompt rubric, 6 criteria,
    all pass. Section 1''s "at least one dedicated test function" and the narrowed
    routing bullet no longer conflict: the bullet states that N tests under one scenario
    ID asserting N different observables is NOT duplication and must PASS, which is
    what section 1 always permitted. Banned pattern 5 is preserved as a defect "regardless
