    test that happens to assert a different observable. The reason-field instruction
    ("naming the duplicated observable and which tests carry it") plus the body''s
    existing "observable Outcome from SPEC" anchor give an LLM reviewer enough grounding
    to act. Subject: the body rendered from the hashed template. RE-JUDGED in review
    round 2 after the subject changed: the first clause said such tests "must PASS"
    unconditionally, colliding with Section 2 over the same per_scenario.quality field;
    the revision scopes the immunity to "for that reason" and states it never overrides
    the banned patterns. All six criteria pass on the new subject; the four-routes-in-one-sentence
    density is noted as readability, not a contradiction.'
