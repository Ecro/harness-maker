  - id: AC-012
    title: "the proposals CLI reports the oldest open proposal's date"
    type: parametric
    test_ids:
      - tests/unit/test_proposals.py::test_ac_012_oldest_open_date
    executable_predicate: null
    golden_table:
      - input: {absent: false, open: [["alpha", "2026-05-17"], ["beta", "2026-08-14"]], resolved: ["gamma"]}
        expected: {open: 2, oldest: "2026-05-17"}
        note: resolved-names-ignored
      - input: {absent: false, open: [["undated", null]], resolved: []}
        expected: {open: 1, oldest: null}
        note: undated-open-yields-null
      - input: {absent: true, open: [], resolved: []}
        expected: {open: 0, oldest: null}
        note: absent-backlog-yields-null
      - input: {absent: false, open: [["late", "2026-08-14"], ["early", "2026-05-17"]], resolved: []}
        expected: {open: 2, oldest: "2026-05-17"}
        note: order-independent
      - input: {absent: false, open: [["dated", "2026-03-01"], ["undated", null]], resolved: []}
        expected: {open: 2, oldest: "2026-03-01"}
        note: undated-entry-does-not-mask-a-dated-one
    rubric_id: null
    pending_test: false
    oracle_source: golden
    oracle_evidence: >-
      Each row states the open proposals and their dates as data; the expected
      oldest date is the minimum of those dates read off the row by hand, and the test
      builds the backlog file from the row, so the expectation never comes from the
      parser under test. Resolved names live only in a RESOLVED batch table. The null rows encode
      the absent-case rule (CLAUDE.md count:8) as data.
    oracle_independence_waiver: null
    input_domain: null
    transformation: null
    expected_relation: null
    preconditions: []
    observable_output: null
    generator_hint: null
