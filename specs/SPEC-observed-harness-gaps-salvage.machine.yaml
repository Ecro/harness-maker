  - id: AC-006
    title: "the count floor is additive to k and never displaces a lexical hit"
    type: property
    test_ids:
      - tests/unit/test_memory_retrieve_count_floor.py::test_count_floor_is_additive_to_k
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: false
    oracle_source: property
    oracle_evidence: >-
      Subset-preservation is a metamorphic relation between two runs of the same
      function under a single flag flip. It holds for every correct additive
      composition and is violated by exactly the carve-out design RESEARCH pitfall 1
      warns against — so it discriminates the two designs without reference to how
      either is coded.
    oracle_independence_waiver: null
    input_domain: "any memory corpus, any topic string, any k >= 1"
    transformation: "run retrieval with the count floor disabled, then enabled, on identical inputs"
    expected_relation: "result(floor_off) is a subset of result(floor_on)"
    preconditions:
      - "both runs use identical corpus, topic, k and byte_cap"
    observable_output: "the set of entry slugs emitted in the fence"
    generator_hint: "include corpora where the highest-count entry is also a top lexical hit, and where it is not"

