  - id: AC-002
    title: "--open and --triaged partition the backlog exactly"
    type: property
    test_ids:
      - tests/unit/test_proposals.py::test_proposals_open_triaged_partition
    executable_predicate: null
    golden_table: []
    rubric_id: null
    pending_test: false
    oracle_source: property
    oracle_evidence: >-
      Partition is a set-algebra relation over the parser's own two outputs and the
      independently-counted heading set; it holds for any correct implementation and
      cannot be satisfied by an implementation that, say, drops malformed headings
      from both buckets. Reading the parser's source cannot make it pass.
    oracle_independence_waiver: null
    input_domain: "any pending-proposals.md content, including empty, all-open, all-resolved, and malformed headings"
    transformation: "parse the file into the open set and the triaged set"
    expected_relation: "open & triaged == empty AND open | triaged == all proposal headings"
    preconditions: []
    observable_output: "two sets of proposal identifiers"
    generator_hint: "vary heading kinds: '## Proposal:', '## RESOLVED …', '## Backlog note'"

