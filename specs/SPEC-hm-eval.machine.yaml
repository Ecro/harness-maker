  executable_predicate: null
  golden_table:
  - input:
      rows: tier 1, 2 tasks x 3 runs per arm; plain $0.10/run with 3 of 6 solved,
        hm $0.40/run with 6 of 6 solved
    expected:
      cost_ratio: 4.00x
      delta_solved: '+3'
      solved_lead: hm
      cost_per_solved: plain $0.200 (n=3), hm $0.400 (n=6)
      extra_per_solved: $0.600 per additional solved run
    edge: false
    note: hm solves more, so the figure is finite ((2.40 - 0.60) / (6 - 3))
  - input:
      rows: plain $0.10/run with 6 of 6 solved, hm $0.40/run with 5 of 6 solved
    expected:
      delta_solved: '-1'
      solved_lead: tie
      cost_per_solved: plain $0.100 (n=6), hm $0.480 (n=5)
      extra_per_solved: 'n/a: no additional solved runs for the extra cost'
    edge: true
    note: plain solves at least as many, so the denominator is <= 0
  - input:
      rows: plain $0.10/run with 6 of 6 solved, hm $0.30/run with 0 of 6 solved
    expected:
      delta_solved: '-6'
      solved_lead: plain
      cost_per_solved: plain $0.100 (n=6), hm n/a (n=0)
      extra_per_solved: 'n/a: no additional solved runs for the extra cost'
    edge: true
    note: 0 solved in the hm arm
  - input:
      rows: plain $0.10/run with 0 of 6 solved, hm $0.40/run with 6 of 6 solved
    expected:
      cost_per_solved: plain n/a (n=0), hm $0.400 (n=6)
      extra_per_solved: $0.300 per additional solved run
    edge: true
    note: 0 solved in the plain arm; (2.40 - 0.60) / 6
  rubric_id: null
  note: 'Amendment 2026-10-15 (DRI): the eval must show what the extra spend buys.
    The section is first in the report text (before Quality, Efficiency and the intent
    block), in RESULTS.md and in the README block; the golden scorecard.txt, RESULTS.md
    and README.after.md carry it. Review round 1: the quality deltas pair runs by
