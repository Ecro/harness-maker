irreversible_decisions:
- id: IRR-001
  decision: docs/evals/history.jsonl row schema (one JSON object per line, sorted
    keys, schema 1, additive-only, keyed by results_digest)
  category: schema/file format/storage layout
  rationale: the committed trend history is append-only; every later row and reader
    depends on the shape
  source: spec
- id: IRR-002
  decision: README marker contract, exactly one <!-- hm:eval:start --> / <!-- hm:eval:end
    --> pair owned by publish, bytes outside never touched
  category: public API/CLI contract
  rationale: hand edits around the block and every later publish rely on it once
    it is in the README
  source: spec
