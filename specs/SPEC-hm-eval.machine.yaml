  title: Every report leads with what the extra cost buys, per tier
  type: parametric
  test_ids:
  - tests/unit/test_bench_light_lane.py::test_extra_cost_section_shows_what_hm_buys
  - tests/unit/test_bench_light_lane.py::test_scorecard_leads_with_quality_over_balanced_changed_runs
  - tests/unit/test_bench_light_lane.py::test_quality_deltas_pair_runs_by_task_and_rep
