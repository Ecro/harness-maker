irreversible_decisions:
- id: IRR-001
  decision: 'harness.yaml gains check: {reuse_inert: list[str]} as a HarnessConfig
    field with an InterviewAnswers mirror; globs: own translator, case-sensitive,
    root-anchored, * and ? never cross /, ** spans any depth'
  category: schema/file format/storage layout
  rationale: users write it and /hm:make must preserve it; a <=0.65.2 harness-maker
    (extra=forbid) rejects a harness.yaml carrying check:, so a declaration requires
    >=0.66 wherever that file is read
  source: spec
- id: IRR-002
  decision: verdict record hm/check-verdict.json becomes {slug, options, head, fingerprint,
    harness_maker_version, files, read_set, gates, line, at}; fingerprint covers gate
    list, degraded reason and config only; files = path->digest; read_set = list or
    null; gates = gate section body; line = the whole verdict line when it exited
    0, else null; the record means the gate section passed; harness_maker_version
    stays in the key so a <=0.65.2 record (no files) is a legacy-record miss
  category: schema/file format/storage layout
  rationale: later versions must parse it
  source: spec
- id: IRR-003
  decision: '--reuse output: reused: true under rule identical with a recorded exit-0
    line reprints the whole 0.65.2 line; any other hit means the gate section was
    reused and every other section ran fresh; reuse: {rule, delta, inert, read_set
    (checked|partial|absent), unobserved}; a fresh run under --reuse carries reuse_miss:
    {reason, paths}; reasons by precedence no-record, legacy-record, bad-declaration,
    key, code, added-removed, undeclared, head, voided, no-read-set'
  category: public API/CLI contract
  rationale: 'wrapup and scripts read it; changes the meaning of hm-cost-p3''s reused:
    true'
  source: spec
