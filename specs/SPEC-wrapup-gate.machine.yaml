irreversible_decisions:
- id: IRR-001
  decision: hm check gains --require-review and a contract section ({ok, crossed,
    allowed, advisory} or {ok, reason}), and exits 1 on an unauthorised Do not change
    crossing or, with the flag, on an unreviewed non-doc change; a bare-path Do not
    change bullet becomes path-matched; user-decided PLAN ADR lines gain the parsed
    form allows <path>
  category: public API/CLI contract
  rationale: rendered stage commands, users' scripts and existing PLANs depend on
    the exit contract and the PLAN format
  source: spec
