irreversible_decisions:
- id: IRR-001
  decision: Maker enters /hm:wrapup, which squash-lands the task on the base branch,
    without the operator typing it; an exempt SPEC lands with no human touch and an
    approved SPEC with DRI-approved irreversible decisions lands without a further
    stop; land hold, unapproved irreversible decisions and push stay gated on the
    DRI
  category: security/permission boundary
  rationale: 'Moves who triggers the land from the operator to Maker; reversible in
    text and the land is local, but an authority change the DRI decides (cards 2026-10-17:
    ''Maker가 이어감'', exempt land).'
  source: spec
- id: IRR-002
  decision: hm world_model digest next_stage values shrink from six stages to research,
    spec, execute, wrapup; SPEC-world-model-followups IRR-001 and AC-003 golden rows
    and SPEC-hm-light-lane-s3a AC-012 golden rows are amended
  category: public API/CLI contract
  rationale: A script or skill matching next_stage == 'review' or 'verify' stops matching;
    those stages no longer exist since 0.64.0, so the old values named commands that
    cannot run.
  source: spec
