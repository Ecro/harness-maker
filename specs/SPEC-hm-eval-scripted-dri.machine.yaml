- id: AC-005
  title: A failed turn, the run budget or a lost session stops the run with its reason
  type: mechanical
  test_ids:
  - tests/unit/test_bench_scripted_dri.py::test_a_failed_turn_stops_the_run_with_its_status
  - tests/unit/test_bench_scripted_dri.py::test_the_run_budget_stops_the_next_turn
  - tests/unit/test_bench_scripted_dri.py::test_a_lost_session_id_stops_the_run
  executable_predicate: (timed_out["status"], kinds(timed_out), timed_out["stopped_at"],
    timed_out["dri_stop"]) == ("timeout", ["spec", "approve", "execute"], 3, None)
    and (capped["dri_stop"], capped["subtype"], kinds(capped)) == ("budget", "error_max_budget_usd",
    ["spec", "approve"]) and kinds(under_cap)[:3] == ["spec", "approve", "execute"]
    and (lost["dri_stop"], kinds(lost)) == ("session_lost", ["spec", "approve"]) and
    all(t == opts.timeout_s for t in invoke_timeouts)
  golden_table: []
  rubric_id: null
  note: timed_out's fake times out on execute; capped's fake reports a running total
