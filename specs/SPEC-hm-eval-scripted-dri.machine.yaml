  title: The hm arm sends spec, approval, execute and wrapup in order in one resumed
    session
  type: mechanical
  test_ids:
  - tests/unit/test_bench_scripted_dri.py::test_hm_cell_sends_spec_approve_execute_wrapup_in_one_resumed_session
  - tests/unit/test_bench_scripted_dri.py::test_later_turns_differ_from_turn_one_only_by_prompt_and_resume
