    " + slug, "/hm:wrapup " + slug] and argvs[0] == hm_argv_today and all(a[:-2] ==
    with_prompt(argvs[0], p) and a[-2:] == ["--resume", first_session_id] for a, p
    in zip(argvs[1:], sent[1:])) and APPROVE_TURN == "I approve this SPEC as written.
    For each open question, take the option you recommend and record it in the SPEC.
    Stamp the approval, then stop."
