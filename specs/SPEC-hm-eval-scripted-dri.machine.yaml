- id: AC-003
  title: The slug is the newest matching SPEC the run created, else none
  type: parametric
  test_ids:
  - tests/unit/test_bench_scripted_dri.py::test_slug_is_the_newest_spec_the_run_created
  - tests/unit/test_bench_scripted_dri.py::test_template_specs_and_other_names_give_no_slug
  executable_predicate: null
  golden_table:
  - input:
      work_specs:
        SPEC-a.md: 1
        SPEC-b.md: 2
      template_specs: []
    expected:
      slug: b
    edge: false
    note: the larger st_mtime_ns wins
  - input:
      work_specs:
        SPEC-a.md: 5
        SPEC-b.md: 5
      template_specs: []
    expected:
      slug: b
    edge: true
    note: equal mtimes, the larger name wins
  - input:
      work_specs:
        SPEC-old.md: 9
        SPEC-new.md: 1
      template_specs:
      - SPEC-old.md
    expected:
      slug: new
    edge: true
    note: a SPEC already in the arm's template is not one the run created
  - input:
      work_specs:
        SPEC-x.machine.yaml: 3
        notes.md: 4
        SPEC-Bad_Name.md: 5
        sub/SPEC-y.md: 6
      template_specs: []
    expected:
      slug: null
    edge: true
    note: machine yaml, other names, a name outside the pattern and subdirectories
      give no slug
  - input:
      work_specs: {}
      template_specs: []
    expected:
      slug: null
    edge: true
    note: no specs/ dir at all
  rubric_id: null
  note: The integers are st_mtime_ns values set with os.utime in the test; the pattern
    is SPEC-([a-z0-9][a-z0-9-]*)\.md directly under work/specs/.
  pending_test: false
  oracle_source: golden
  oracle_evidence: Each expected slug follows by hand from SPEC S3's rule (directly
    under specs/, name pattern, absent from the template path, max of st_mtime_ns
    then name) applied to the table's file list; the file layout matches the PR-S
    spec stage's specs/SPEC-<slug>.md path seen in /var/tmp/hm-eval-p1 work dirs.
  oracle_independence_waiver: null
