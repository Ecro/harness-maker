  oracle_evidence: The fake agent records its argv, its git status and its file listing
    from inside the work dir; the plain arm's listing is compared with the fixture directory
    on disk and the hm arm's with that plus the harness paths, so the reference is the fixture
    tree, independent of the runner's copy code.
  oracle_independence_waiver: null
  input_domain: one task run in the plain and the hm arm
  transformation: compare the recorded argv, git status and file listing of the two arms
  expected_relation: files(plain) == files(fixture) and files(hm) - files(plain) are all
    under .claude/ or are CLAUDE.md/.gitignore and argv differs only at the prompt, where
    prompt(hm) == '/hm:spec ' + prompt(plain), and both git statuses are empty and no hidden
