- id: AC-006
  title: The report applies the pre-registered verdict rule
  type: parametric
  test_ids:
  - tests/unit/test_bench_light_lane.py::test_report_verdict
  executable_predicate: null
  golden_table:
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.40 each, all pass
    expected:
      ratio: 4.0
      verdict: met
    edge: false
    note: ''
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $2.20 each, all pass
    expected:
      ratio: 22.0
      verdict: missed
    edge: false
    note: ratio above target
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.30 each, one run fails
    expected:
      ratio: 3.0
      verdict: missed
    edge: true
    note: pass-rate counter-signal
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.50 each, all pass
    expected:
      ratio: 5.0
      verdict: met
    edge: true
    note: target is inclusive
  - input:
      plain: 2 tasks x 3 runs
      hm: none
    expected:
      ratio: null
      verdict: no_data
    edge: true
    note: ''
  - input:
      plain: 2 tasks x 3 runs
      hm: 2 tasks, one with 2 runs
    expected:
      verdict: no_data
    edge: true
    note: unbalanced grid
  - input:
      plain: 2 tasks x 3 runs, $0.10 each
      hm: 2 tasks x 3 runs, $0.40 each, plus one setup_error row at $9
    expected:
      ratio: 4.0
      verdict: met
    edge: true
    note: setup failures excluded
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: The rule is copied from intent/HM-LIGHT-LANE.md "판정 규칙 (사전 등록)" and
    the metric's how_measured in .claude/intent.yaml (mean over mean, target 5, pass-rate
    counter-signal), registered before the runner existed.
