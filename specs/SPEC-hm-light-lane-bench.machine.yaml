      work: reference applied plus work/pytest.ini (addopts -k), work/timeparse/pytest.ini,
        work/pytest.py or work/sitecustomize.py
    expected:
      passed: true
      sitecustomize_ran: false
    edge: true
    note: only work/timeparse is copied into the clean grade dir, so nothing beside
      it is importable or read
  - input:
      work: reference applied plus a package import that calls pytest.skip, or one
        that hangs
    expected:
