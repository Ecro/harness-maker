- id: AC-006
  title: The report applies the pre-registered verdict rule
  type: parametric
  test_ids:
  - tests/unit/test_bench_light_lane.py::test_report_verdict
  - tests/unit/test_bench_light_lane.py::test_unpriced_runs_stay_out_of_the_cost_mean_and_never_make_a_free_arm
  - tests/unit/test_bench_light_lane.py::test_the_recorded_value_is_the_number_the_verdict_used
  - tests/unit/test_bench_light_lane.py::test_suspect_and_no_data_record_nothing
  - tests/unit/test_bench_light_lane.py::test_budget_capped_runs_are_counted_and_reported
  executable_predicate: null
  golden_table:
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.40 each, all pass
    expected:
      ratio: 4.0
      verdict: met
    edge: false
    note: ''
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $2.20 each, all pass
    expected:
      ratio: 22.0
      verdict: missed
    edge: false
    note: ratio above target
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.30 each, one run fails
    expected:
      ratio: 3.0
      verdict: missed
    edge: true
    note: pass-rate counter-signal
  - input:
      plain: 2 tasks x 3 runs, $0.10 each, all pass
      hm: 2 tasks x 3 runs, $0.50 each, all pass
    expected:
      ratio: 5.0
      verdict: met
    edge: true
    note: target is inclusive
  - input:
      plain: 2 tasks x 3 runs
      hm: none
    expected:
      ratio: null
      verdict: no_data
    edge: true
    note: ''
  - input:
      plain: 2 tasks x 3 runs
      hm: 2 tasks, one with 2 runs
    expected:
      verdict: no_data
    edge: true
    note: unbalanced grid
  - input:
      plain: 2 tasks x 3 runs, $0.10 each
      hm: 2 tasks x 3 runs, $0.40 each, plus one setup_error row at $9
    expected:
      ratio: 4.0
      verdict: met
    edge: true
    note: setup failures excluded
  - input:
      plain: t1 $0.1, t2 $0.3 (3 runs each)
      hm: t1 $0.2, t2 $1.0 (3 runs each)
    expected:
      ratio: 3.0
      verdict: met
    edge: false
    note: unequal costs, by hand 0.6 / 0.2
  - input:
      plain: t1 $0.1, t2 $0.9
      hm: t1 $1.0, t2 $1.0
    expected:
      ratio: 2.0
      verdict: met
    edge: true
    note: mean of per-task ratios would be 5.56
  - input:
      plain: $1.0 each
      hm: $5.004 each
    expected:
      ratio: 5.004
      verdict: missed
    edge: true
    note: the verdict compares the unrounded ratio and the recorded value has 3 places
  - input:
      plain: $0.10 each
      hm: CLI $0.46, transcript $0.54
    expected:
      ratio: 5.4
      verdict: missed
    edge: true
    note: the larger of the CLI and transcript ratios decides when they agree within
      20%, and it is the number recorded
  - input:
      plain: $0.10 each
      hm: CLI $0.40, transcript $1.20
    expected:
      ratio: null
      verdict: suspect
    edge: true
    note: CLI and transcript ratios differ by more than 20%; the record line is n/a
  - input:
      plain: $0.10 each
      hm: $0.40 each, one run with subtype error_max_budget_usd (or leak_suspect)
    expected:
      ratio: null
      verdict: suspect
    edge: true
    note: a met resting on a capped or leaking run is lowered to suspect
  rubric_id: null
  note: ''
