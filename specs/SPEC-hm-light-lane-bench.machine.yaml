- id: AC-005
  title: Grading is strict and isolated from the work dir
  type: parametric
  test_ids:
  - tests/unit/test_bench_light_lane.py::test_grading_is_strict_and_isolated
  executable_predicate: null
  golden_table:
  - input:
      work: reference applied
    expected:
      passed: true
    edge: false
    note: ''
  - input:
      work: pristine fixture
    expected:
      passed: false
    edge: false
    note: ''
  - input:
      work: reference applied plus a syntax error in the task module
    expected:
      passed: false
    edge: true
    note: collection error counts as failure
  - input:
      work: pristine fixture plus a root conftest.py that marks every test skipped-as-passed
    expected:
      passed: false
    edge: true
