irreversible_decisions:
- id: IRR-001
  decision: 'Add top-level loop.enabled: bool to harness.yaml; fresh renders write
    schema_version: 6'
  category: schema/file format/storage layout
  rationale: Shipped user files carry the key; renaming needs a migration and older
    plugins reject it (extra=forbid)
  source: spec
- id: IRR-002
  decision: Off only when no harness.yaml exists on disk; every existing file keeps
    its explicit bool, or true when absent/unreadable, on every re-render path
  category: data migration
  rationale: Decides what every existing harness becomes on its next --update; a wrong
    default silently removes a command users may rely on
  source: spec
