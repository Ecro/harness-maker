- id: AC-009
  title: A path receives only its own group's commands
  type: property
  test_ids:
  - tests/unit/test_oracle_toolchain_gate.py::test_path_receives_only_its_own_toolchain_commands
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Metamorphic over the argv boundary: for every recorded invocation,
    the path argument''s extension is in the same toolchain entry that supplied the
    command template. Stated as a cross-product invariant over a mixed-language path
    set, so a flat-list implementation that runs every command on every covered path
    violates it on the very first pair — which is exactly the defect two independent
    second-opinion models found in the flat design.'
  oracle_independence_waiver: null
  input_domain: a toolchains list of >= 2 entries with disjoint extension sets, and
    an in-diff path set containing at least one path per entry
  transformation: call gather() over the mixed path set
  expected_relation: for every recorded invocation (template, path), extension_of(path)
    in entry_of(template).extensions
  preconditions:
  - the entries' extension sets are disjoint (overlap is rejected at load time)
  observable_output: the recorded (template, path) invocation pairs
  generator_hint: parametrise over python+node and python+rust pairings
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
