- id: AC-001
  title: Toolchain that cannot parse a file runs nothing
  type: property
  test_ids:
  - tests/unit/test_oracle_toolchain_gate.py::test_uncovered_extension_spawns_no_subprocess
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Metamorphic: for any extension outside the resolved toolchain''s
    registered set, the observed subprocess count is 0. The relation is stated over
    the tool-invocation boundary (a patched subprocess.run), not over any value the
    implementation computes, so an implementation cannot satisfy it by construction
    without actually skipping.'
  oracle_independence_waiver: null
  input_domain: in-diff paths whose extension is absent from the resolved toolchain's
    registered extension set (.tsx, .rs, .go, .md, extensionless)
  transformation: call gather() with a finding naming that path
  expected_relation: subprocess_run_call_count == 0 AND finding_id in no_oracle_tail
    AND finding_id not in any emitted block label
  preconditions:
  - the path passes safe_paths (in-diff, no metacharacters, relative)
  observable_output: emitted oracle text plus the recorded subprocess invocation list
  generator_hint: parametrise over an extension list including an extensionless path
