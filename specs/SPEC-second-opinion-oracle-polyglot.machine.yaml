- id: AC-011
  title: Total loss of coverage is visible to the user
  type: mechanical
  test_ids:
  - tests/unit/test_oracle_toolchain_gate.py::test_zero_labelled_block_emits_exactly_one_stderr_warning
  executable_predicate: stderr_warning_count == 1 and stdout == unaffected_stdout
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: 'Exactly-one and cause-differentiated is the golden, not at-least-one:
    a per-path warning would flood a large diff and a zero-warning run is the silent
    degradation this AC exists to remove. Both bounds are asserted against captured
    stderr, and the stdout equality is compared to the no-warning run''s stdout so
    the signal cannot leak into the injected payload. The trigger is asserted as an
    OUTPUT property (no id-labelled block emitted) rather than a config property,
    because an all-repo-wide but non-empty config satisfies every config-shaped predicate
    while producing zero per-finding evidence - the seeded-Rust case.'
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
