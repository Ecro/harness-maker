- id: AC-006
  title: Substitution never precedes sanitisation
  type: property
  test_ids:
  - tests/unit/test_oracle_toolchain_gate.py::test_unsafe_file_value_never_reaches_argv
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Invariant over the argv boundary: every element of every executed
    command is either a literal from the declared command string or a member of safe_paths''
    return value. Asserted against the recorded argv lists, so it holds regardless
    of how the implementation orders substitution internally, and a substitute-then-filter
    ordering violates it observably.'
  oracle_independence_waiver: null
  input_domain: 'adversarial file values: option-shaped (--basetemp=/x), absolute
    (/etc/passwd), traversing (../../x), metacharacter-bearing (a;rm -rf b), in-repo-but-off-diff,
    and a legal in-diff path CONTAINING A SPACE (_UNSAFE_CHARS does not reject it);
    crossed with command templates bearing repeated and embedded placeholders (--file={path},
    {path}.snap)'
  transformation: call gather() with a {path}-bearing declared command
  expected_relation: for every argv element e in every recorded invocation, e in literal_tokens(declared)
    or e in safe_paths(candidates, changed_files); AND every recorded invocation's
    cwd equals the --root worktree, never the base root; AND every {path} occurrence
    in every token is substituted with no re-split, so a space-containing path stays
    ONE argv element
  preconditions:
  - subprocess is invoked with a list, never a string, and shell is never True
  - templates are shlex.split BEFORE substitution, never after
  observable_output: the recorded argv lists and the recorded cwd of each invocation
  generator_hint: reuse the adversarial values already fixtured for safe_paths tests
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
