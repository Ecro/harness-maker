- id: AC-012
  title: A malformed or inert toolchain declaration degrades, never raises
  type: property
  test_ids:
  - tests/unit/test_oracle_toolchain_gate.py::test_malformed_toolchains_degrades_without_raising
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Invariant over an adversarial config domain rather than one hand-picked
    malformation: for every ill-formed toolchains value, gather() returns normally
    and emits no id-labelled block. The relation is stated over the function boundary
    and the emitted text, so it cannot be satisfied by catching the one exception
    the implementer happened to think of - a new malformation shape that escapes still
    fails the property.'
  oracle_independence_waiver: null
  input_domain: 'ill-formed toolchains values: non-list, non-mapping entry, overlapping
    extension sets, entry with empty commands, entry with empty extensions, unknown
    role key; PLUS the two config-READ failures that raise outside any ValidationError
    handler - a harness.yaml that is unparseable YAML, and a base-root resolution
    that raises'
  transformation: call gather() with each value present at the base-root harness.yaml
  expected_relation: gather() returns a str for every input, NO exception of ANY type
    escapes resolve_toolchains(), and no emitted block carries a finding id
  preconditions:
  - main() guards only the findings-file parse today, so the guard must live in gather()
  - the contract is "no exception of any type", not "validation errors are caught"
  observable_output: the return value, the raised-exception set, and the emitted block
    labels
  generator_hint: null
  judgment_verdict: null
  judged_at: null
