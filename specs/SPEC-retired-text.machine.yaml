- id: AC-006
  title: The replay digest is independent of the install ref's length
  type: property
  test_ids:
  - tests/integration/test_overhaul_p1_eval3_replay.py::test_ac_006_digest_ignores_install_ref_length
  - tests/integration/test_overhaul_p1_eval3_replay.py::test_ac_006_manifest_matches_original_provenance
  - tests/integration/test_overhaul_p1_eval3_replay.py::test_ac006_section_verdicts_match_golden
  executable_predicate: len({digest(render_frontmatter(ref)) for ref in refs}) ==
    1 and all(r['digest'] == manifest for r in PROVENANCE['originals']) and len(PROVENANCE['originals'])
    == 36 and (not ORIGINALS_ON_DISK or all(recompute(r) == r['digest'] for r in PROVENANCE['originals']))
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: YAML's emitter folds a plain scalar only at a space, so folded
    and unfolded frontmatter differ only in whitespace runs; collapsing them is invariant
    under the fold position whatever the implementation. The manifest side is pinned
    to the 36 original eval-3 hm runs' harness commits (recorded SHAs and per-run
    digests), which this change does not produce; a recompute from today's replay
    render would not match a recorded SHA.
  oracle_independence_waiver: null
  input_domain: install refs of 8-200 characters from [A-Za-z0-9/._-], as the Maker
    frontmatter's `hm` prefix
