  title: the shard filter partitions the suite by file
  type: property
  test_ids:
  - tests/unit/test_ci_shard_serial_nightly.py::test_ac_001_shard_filter_partitions_by_file
  executable_predicate: set().union(*shards) == all_tests and pairwise_disjoint(shards)
    and same_file_same_shard(shards)
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: The relation is a set partition checked against pytest's own unsharded
    collection, not against the hash function under test.
  oracle_independence_waiver: null
  input_domain: n in 1..5 over this repository's test files; HM_TEST_SHARD values
    unset, '1/1', 'i/n', and malformed strings ('0/3', '4/3', 'x', '1/0', '')
  transformation: collect the same test files once per shard i/n and once with HM_TEST_SHARD
    unset
  expected_relation: the per-shard selections are pairwise disjoint, their union equals
    the unsharded collection, every test of one file lands in one shard, and a malformed
    value is a usage error
  preconditions: []
  observable_output: the node ids pytest keeps per HM_TEST_SHARD value (collect-only
