- id: AC-008
  title: The light check runs the kept gates and dispatches no subagent
  type: mechanical
  test_ids:
  - tests/render/test_render_light_lane_s3a.py::test_light_check_runs_the_kept_gates
  - tests/unit/test_cli_security_scan_force.py::test_force_bypasses_the_fresh_scan_cache
  executable_predicate: 'all(SCAN_CMD[wt] in text and ''hm spec_machine approval-status''
    in text and RUN_CMD in text and ''mark-pass'' not in text and CHECK4_RULE in text
    and FINDINGS_FILE[wt] in text and all(c in text for c in CHECK6_CMDS) and ''BLOCKED:
    check 6'' not in text and DRIFT_RULE in text and REVIEWERS_STILL_RUN not in text
    and not DISPATCH_RE.search(text) and (all(c in text for c in MECH) if MECH else
    ''## MECHANICAL_BLOCK'' not in text) for wt, text, MECH in LIGHT_CHECK_RENDERS)
    and scan_all_mock.call_args.kwargs[''force''] is True'
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: golden
  oracle_evidence: 'SCAN_CMD is pinned here before the edit: worktree on -> ''hm cli
    security-scan <WT> --force'', worktree off -> ''hm cli security-scan . --force''.
    RUN_CMD, CHECK4_RULE (Check 4''s ''FAIL when:'' line) and CHECK6_CMDS (the op-check
    and waiver-check command lines) are sliced from verify''s Check 2, 4 and 6 in
    the e7dd6648 verify render (Claude and Codex arms). Under the partials'' light_check
    flag (review item F) the light check keeps those lines and drops the guessed-gates
    mark-pass path, the BLOCKED box and the 6a/6b prose; verify''s own render is unchanged
    (AC-011). FINDINGS_FILE is ''<WTR>/.claude/observability/security/findings-<today>.jsonl''
    (review item K: the scan''s own rows only). DRIFT_RULE is review Step 2''s body
    from the e7dd6648 review render minus REVIEWERS_STILL_RUN, the sentence ''Drift
    findings get severity `P1` and surface in the REVIEW report; reviewers still run
    on the actual diff.'' DISPATCH_RE matches the dispatch macro''s rendered forms
    (Agent(, subagent_type, spawn_agent) from agents/_partials/dispatch.md.j2 at e7dd6648.
    Fixtures: worktree on and off, mechanical_checks unset and set to two commands.
