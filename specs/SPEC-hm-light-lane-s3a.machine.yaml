  title: The lane reader reads exactly light, everything else as full
  type: mechanical
  test_ids:
  - tests/unit/test_light_lane.py::test_lane_of
  executable_predicate: all(light_lane.lane_of(base, slug) == expected for base, slug,
    expected in LANE_TABLE)
  golden_table:
  - input:
      case: SPEC-<slug>.md frontmatter lane light
    expected: light
  - input:
      case: SPEC-<slug>.md frontmatter lane full
    expected: full
  - input:
      case: SPEC-<slug>.md without a lane key
    expected: full
  - input:
      case: lane Light, lane 'light ' or lane true
    expected: full
  - input:
      case: unparseable frontmatter
    expected: full
  - input:
      case: no SPEC-<slug>.md, or slug None, '..' or containing '/'
    expected: full
  - input:
      case: lane light only in the per-task worktree checkout, not the base
    expected: light
  rubric_id: null
