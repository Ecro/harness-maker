irreversible_decisions:
- id: IRR-001
  decision: Add stage_skipped to the autopilot ledger's closed event vocabulary, with fields
    from, skipped, to and reason
  category: schema/file format/storage layout
  rationale: Once rows exist the name stays readable forever, as advanced and objective_proposed
    do; the /hm:health smoke denominator counts every event
  source: spec
- id: IRR-002
  decision: The light-check record is REVIEW-{slug}-{date}.md with review_kind light-check
    and status PASSED, carrying review's drift_verdict
  category: schema/file format/storage layout
  rationale: Wrapup commits it, so it persists in history; the boundary, the digest, wrapup
    Step 3 and verify Check 1 read it, and a reader may not later drop review_kind
  source: spec
- id: IRR-003
  decision: Add the generated file .claude/hm/execute-light-check.md, the name the execute
    command reads
  category: schema/file format/storage layout
  rationale: Renaming it needs a retire step for copies on disk, as SPEC-hm-light-lane-s2b
    IRR-001
  source: spec
