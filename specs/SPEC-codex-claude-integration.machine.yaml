irreversible_decisions:
- id: IRR-001
  decision: Add claude to second_opinion.models and provider telemetry; preserve existing
    provider identities and historical plan records.
  category: schema/file format/storage layout
  rationale: Independently authored configs and ledger consumers must agree on the
    persisted provider identity.
  source: spec
- id: IRR-002
  decision: Use existing Claude CLI authentication in capability-checked safe-mode,
    context on stdin and no ambient tools/customizations; never fall back to permission
    bypass or bare API-key-only mode.
  category: security/permission boundary
  rationale: This defines what user data and execution powers a secondary model receives;
    changing it silently would violate caller expectations.
  source: spec
- id: IRR-003
  decision: Expose bundled hm-make and hm-update skills using native Codex plugin
    add/marketplace upgrade and a matching stable Python engine; complete means plugin
    engine and generated project all match.
  category: public API/CLI contract
  rationale: Users automate these entry points and rely on update completion meaning
    all three layers rather than marketplace refresh alone.
  source: spec
