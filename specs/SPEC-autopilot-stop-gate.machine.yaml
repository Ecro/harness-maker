- id: AC-002
  title: Without a refusing state the stop hook equals the df070f6c loop gate
  type: property
  test_ids:
  - tests/unit/test_autopilot_stop_gate.py::test_ac002_equals_the_reference_loop_gate_without_a_refusing_state
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: differential
  oracle_evidence: The reference is the df070f6c hooks/loop_gate.py, loaded from `git
    show` into a temp module before any edit; any implementation that confines its
    change to the refusing state satisfies the relation.
  oracle_independence_waiver: null
  input_domain: loop marker {own content match, foreign content, legacy global with
    an id-less payload, legacy global with an id payload, none} x stop_hook_active
    {true, false} x autopilot marker {none, gated, foreign, expired} x ledger {absent,
    [authorized execute]} x transcript {absent, nothing after the authorization}
  transformation: run `_stop_hook(payload)` under the reference module and under the
    new module on the same tmp project
  expected_relation: stdout(new) == stdout(ref) and exit(new) == exit(ref)
  preconditions:
  - the same fixture builder is used for both modules
  observable_output: the list of cells whose stdout or exit differ, empty
  generator_hint: itertools.product over the domain
