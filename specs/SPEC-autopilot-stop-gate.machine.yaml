- id: AC-003
  title: Replaying the eval-2 hm runs blocks exactly the five stalled runs, and no
    other run at its end or at any stage start
  type: parametric
  test_ids:
  - tests/unit/test_autopilot_stop_gate.py::test_ac003_replay_at_run_end
  - tests/unit/test_autopilot_stop_gate.py::test_ac003_no_skill_call_cut_blocks
  executable_predicate: null
  golden_table:
  - input:
      case: t5-hm-1, t5-hm-3, t7-hm-3, t10-hm-3, t11-hm-1 at their end, with an own
        active marker created before the first row
    expected: exit 2, reason names /hm:execute
    edge: false
    note: the post-spec stalls
  - input:
      case: t4-hm-1 at its end, same marker
    expected: exit 0, no stdout
    edge: true
    note: verify authorized and unconfirmed, but Skill(hm:verify) ran and STOPped
      at Check 4
  - input:
      case: the other 29 runs with a ledger, at their end, same marker
    expected: exit 0, no stdout
    edge: false
    note: t12-hm-2 has no ledger and is not a fixture
  - input:
      case: every run, cut right after each Skill(hm:<stage>) call
    expected: exit 0, no stdout
    edge: false
    note: a stage that started is never refused; this is the mid-body state
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: The five run ids and their stage were read by hand from the eval-2
    ledger tails and transcripts on 2026-10-15, before any implementation; t4-hm-1's
    verify STOP was read from its transcript. dangling_authorizations was a cross-check
    only. The cut points are the Skill tool_use timestamps in those transcripts, where
    the stage demonstrably started.
  oracle_independence_waiver: null
