ac:
- id: AC-001
  title: The stop-hook decision is the golden function of marker, ledger, transcript
    and payload state
  type: parametric
  test_ids:
  - tests/unit/test_autopilot_stop_gate.py::test_ac001_golden_state_table
  - tests/unit/test_autopilot_stop_gate.py::test_ac001_r22_read_oserror_fails_open_with_one_warn_line
  executable_predicate: null
  golden_table:
  - input:
      case: own active auto marker, no peer; ledger [authorized execute]; transcript
        has nothing after it; stop_hook_active false
    expected: exit 2, decision block, reason names /hm:execute
    edge: false
    note: the t5/t7/t10/t11 end state
  - input:
      case: as row 1, ledger [authorized execute, entered execute, authorized review]
    expected: exit 2, decision block, reason names /hm:review
    edge: false
    note: the later stage is the one named
  - input:
      case: as row 1, transcript has Skill(hm:execute) after the authorization
    expected: exit 0, no stdout
    edge: false
    note: execute is running (question, halt, or died mid-body)
  - input:
      case: as row 1, transcript has a non-meta user string entry after the authorization
    expected: exit 0, no stdout
    edge: false
    note: a later turn; covers a user's pause
  - input:
      case: as row 1, transcript has a task-notification user entry after the authorization
    expected: exit 0, no stdout
    edge: true
    note: conservative; any non-tool-result, non-meta user entry ends the gate's interest
  - input:
      case: as row 1, transcript has only isMeta text and tool_result user entries
        after the authorization
    expected: exit 2, decision block, reason names /hm:execute
    edge: true
    note: tool output and skill expansions are not a new turn
  - input:
      case: as row 1, stop_hook_active true
    expected: exit 0, no stdout
    edge: false
    note: one refusal per stop
  - input:
      case: as row 1, ledger [authorized execute, entered execute]
    expected: exit 0, no stdout
    edge: false
    note: confirmed
  - input:
      case: as row 1, ledger [authorized execute, authorized execute, entered execute]
    expected: exit 0, no stdout
    edge: true
    note: a re-run boundary; pairing collapses per session window
  - input:
      case: as row 1, ledger absent or []
    expected: exit 0, no stdout
    edge: false
    note: ''
  - input:
      case: no marker; ledger [authorized execute]
    expected: exit 0, no stdout
    edge: false
    note: ''
  - input:
      case: own marker at level gated; ledger [authorized execute]
    expected: exit 0, no stdout
    edge: true
    note: a gated session sees peers' rows
  - input:
      case: marker at this session's key holding another id; ledger [authorized execute]
    expected: exit 0, no stdout
    edge: true
    note: foreign
  - input:
      case: own marker past its expiry; ledger [authorized execute]
    expected: exit 0, no stdout
    edge: true
    note: expired
  - input:
      case: as row 1, plus a fresh id-bearing marker of another session
    expected: exit 0, no stdout
    edge: true
    note: the ledger is shared; fail open while a peer is armed
  - input:
      case: own marker created after the only authorized row
    expected: exit 0, no stdout
    edge: true
    note: the window starts at created_at
  - input:
      case: own marker narrowed to pipeline [research, spec]; ledger [authorized execute]
    expected: exit 0, no stdout
    edge: true
    note: the stage must be in marker.pipeline
  - input:
      case: own loop marker and row 1's autopilot state
    expected: exit 2, the loop reason unchanged
    edge: true
    note: loop precedence
  - input:
      case: as row 1, payload without transcript_path, or the path unreadable
    expected: exit 0, no stdout
    edge: true
    note: fail open
  - input:
      case: as row 1, transcript readable but with no Claude Code record
    expected: exit 0, no stdout, one stderr line starting [loop-gate] warn
    edge: true
    note: a foreign format must not read as never invoked
  - input:
      case: as row 1, the ledger has a garbage line before the authorization
    expected: exit 2, decision block, reason names /hm:execute
    edge: true
    note: the ledger reader skips unparseable lines
  - input:
      case: as row 1, the marker or ledger read raises OSError
    expected: exit 0, no stdout, one stderr line starting [loop-gate] warn
    edge: true
    note: fail open
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: The rows come from the eval-2 run end states, the marker contract
    (active, gated, foreign, expired, narrowed, peer as autopilot.status reports them),
    the Claude Code transcript fields observed in the eval-2 transcripts (isMeta,
    origin task-notification, tool_result) and the Stop-hook stop_hook_active rule;
    none is derived from the new branch.
