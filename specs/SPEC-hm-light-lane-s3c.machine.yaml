irreversible_decisions:
- id: IRR-001
  decision: 'spec_machine check --all prints one line whenever no gate failed, a weak score included;
    its failure payload drops scores, yaml_path and md_path, prints each error once (pydantic as <loc>:
    <msg>) and turns by_rule into counts'
  category: public API/CLI contract
  rationale: Rendered spec text and any script parsing the payload read these keys; restoring them later
    breaks readers written against the quiet form
  source: spec
- id: IRR-002
  decision: A trusted light task outside loop mode has no work-docs/PLAN-{slug}.md; its spec_need_verdict
    and spec_need_target live in the SPEC .md frontmatter; every PLAN reader accepts no PLAN plus SPEC
    lane light
  category: schema/file format/storage layout
  rationale: Light tasks land in history without a PLAN; no reader may later require one for them
  source: spec
- id: IRR-003
  decision: A light machine.yaml carries only the minimal key set of spec Step 3.5
  category: schema/file format/storage layout
  rationale: Committed light SPECs lack the optional keys; a validator may never require them for a light
    SPEC
  source: spec
- id: IRR-004
  decision: Add the generated files .claude/hm/stage-preamble.md, .claude/hm/execute-plan.md and .claude/hm/spec-machine-full.md,
    the names the commands read
  category: schema/file format/storage layout
  rationale: Renaming needs a retire step for copies on disk (s2b IRR-001, s3a IRR-003)
  source: spec
