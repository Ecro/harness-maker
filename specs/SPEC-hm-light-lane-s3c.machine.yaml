- id: AC-006
  title: A failing check prints each error once and names its low dimensions with
    scores
  type: mechanical
  test_ids:
  - tests/unit/test_spec_machine_check_quiet.py::test_failure_prints_each_error_once
  executable_predicate: all(verdict(new[f]) == verdict(OLD[f]) and error_locations(new[f])
    == error_locations(OLD[f]) and no_duplicate_errors(new[f]) and 'errors.pydantic.dev'
    not in new[f] and 'input_value' not in new[f] and set(payload(new[f])) == FAIL_KEYS
    for f in FAILURE_FIXTURES) and all(isinstance(score, int) and score < 60 for score
    in payload(new['block_overall_55'])['quality']['low_dimensions'].values()) and
    payload(new['block_overall_55'])['quality']['low_dimensions'] and re.fullmatch(YAML_SYNTAX_ERR,
    payload(new['unparseable_yaml'])['validate']['errors'][0]) and re.fullmatch(MISSING_FILE_ERR,
    payload(new['missing_yaml_file'])['validate']['errors'][0]) and set(payload(new['raise_and_validate_fails'])['quality'])
    == {'error', 'strictness'}
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: differential
  oracle_evidence: 'OLD[f] is the stdout and exit code of the a7403f2f spec_machine
    module on the same fixture, captured before the edit; FAILURE_FIXTURES replay
    the bench failure kinds (string golden input, row without expected, missing AC
    heading, title mismatch, v2 AC without oracle_evidence, unparseable yaml) plus
    missing_yaml_file, raise_and_validate_fails (evaluate_spec raising while validate
    fails) and block_overall_55 (block strictness, overall 55, no dim < 40), whose
    dimension scores are those OLD prints under ''scores''. verdict = ok, exit code,
    validate.ok, cross_validate.ok, quality.blocked. FAIL_KEYS = {ok, strictness,
    validate, cross_validate, quality} and the two load-error formats (YAML_SYNTAX_ERR
    ''yaml load failed: YAMLError: <problem> (line L, column C)'', MISSING_FILE_ERR
    ''yaml load failed: FileNotFoundError: <path>'', or OSError) are this SPEC''s
    B contract, written before the code.'
