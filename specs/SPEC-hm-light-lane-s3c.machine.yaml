irreversible_decisions:
- id: IRR-001
  decision: 'spec_machine check --all prints one line whenever no gate failed (with
    weak_dimensions and low_dimensions on a weak or low score); its failure payload
    drops scores, yaml_path and md_path, adds low_dimensions, prints each error once
    (pydantic as <loc>: <msg>) and turns by_rule into counts'
  category: public API/CLI contract
  rationale: Rendered spec text and any script parsing the payload read these keys;
    restoring them later breaks readers written against the quiet form
  source: spec
- id: IRR-002
  decision: A trusted light task outside loop mode carries the short light PLAN (the
    inline template's frontmatter keys and three sections) instead of the full nine-section
    template
  category: schema/file format/storage layout
  rationale: Light PLANs land in history; no reader may later require a full-template
    section or a phase field the light template omits
  source: spec
- id: IRR-003
  decision: A light machine.yaml is authored minimal (the Step 3.5 key set); tooling
    may materialise defaults; no validator may require an optional key
  category: schema/file format/storage layout
  rationale: Committed light SPECs lack the optional keys; requiring one later invalidates
    them
  source: spec
- id: IRR-004
  decision: Add the generated files .claude/hm/stage-preamble.md, .claude/hm/execute-plan.md
    and .claude/hm/spec-machine-full.md, the names the commands and /hm:health read
  category: schema/file format/storage layout
  rationale: Renaming needs a retire step for copies on disk (s2b IRR-001, s3a IRR-003)
  source: spec
