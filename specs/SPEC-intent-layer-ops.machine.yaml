  expected_relation: >-
    row['evidence'] == f"auto: measure#{row['definition_hash'][:12]} @ {sha} exit=0 cwd=base"
    and no shlex token of cmd longer than 3 characters occurs in row['evidence']
    and len(row['evidence']) is the same for every generated cmd
