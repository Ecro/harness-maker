- id: AC-004
  title: unmeasurable counts are null with reason
  type: parametric
  test_ids: []
  executable_predicate: null
  golden_table:
  - input:
      world: not_filled_in skeleton, committed
    expected: filled_at=None wrapups_since_fill=None due=false reason=not_filled_in
    edge: true
    note: ''
  - input:
      world: filled, git binary missing (FileNotFoundError)
    expected: filled_at=None wrapups_since_fill=None due=false reason=no_git
    edge: true
    note: ''
  - input:
      world: filled, checkout is not a git repository
    expected: filled_at=None wrapups_since_fill=None due=false reason=no_git
    edge: true
    note: ''
  - input:
      world: filled and committed in a shallow clone
    expected: filled_at=None wrapups_since_fill=None due=false reason=no_git
    edge: true
    note: a shallow boundary would fabricate filled_at
  - input:
      world: history contains a commit that deleted intent.yaml before it was re-added filled
    expected: filled_at=<fill commit iso> reason=ok
    edge: true
    note: per-blob git show failure skips the blob, never no_git
  - input:
      world: skeleton committed, filled only in the working tree
    expected: filled_at=None wrapups_since_fill=None due=false reason=fill_uncommitted
    edge: true
    note: ''
  - input:
      world: filled and committed, no stage-spans.jsonl at the base root
    expected: filled_at=<commit iso> wrapups_since_fill=None due=false reason=no_stage_spans
    edge: true
    note: ''
  - input:
      world: filled and committed, a directory at the stage-spans path
    expected: filled_at=<commit iso> wrapups_since_fill=None due=false reason=no_stage_spans
    edge: true
    note: ''
  - input:
      world: filled and committed, stage-spans has only non-wrapup events
    expected: filled_at=<commit iso> wrapups_since_fill=None due=false reason=no_wrapup_spans
    edge: true
    note: wrapup spans not instrumented (worktree off, Cursor/Codex) is not zero
