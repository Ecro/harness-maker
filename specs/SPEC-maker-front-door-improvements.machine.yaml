irreversible_decisions:
- id: IRR-001
  decision: 'intent-layer and project-knowledge render with disable-model-invocation:
    true; reachable only by typing or via Maker''s Read'
  category: public API/CLI contract
  rationale: changes how every rendered harness reaches these skills
  source: spec
- id: IRR-002
  decision: 'New rendered file .agents/skills/<name>/agents/openai.yaml with policy.allow_implicit_invocation:
    false'
  category: schema/file format/storage layout
  rationale: new owned path; orphan sweep and ownership must track it
  source: spec
- id: IRR-003
  decision: hm world_model digest JSON gains intents.active[], task parked and task
    latest_artifact
  category: public API/CLI contract
  rationale: consumed by rendered Maker templates
  source: spec
- id: IRR-004
  decision: hm world_model digest appends a maker_load row to a local observability
    jsonl
  category: schema/file format/storage layout
  rationale: digest stops being write-free; new persisted row shape
  source: spec
- id: IRR-005
  decision: Maker may narrow the session's autopilot pipeline (reverses PLAN-world-model-name
    ADR-008 routes-only)
  category: security/permission boundary
  rationale: the router now changes autonomy state
  source: spec
- id: IRR-006
  decision: 'hm memory_retrieve: floor fills only slots lexical hits leave empty;
    newest bullet per entry; 8,192-byte cap drops whole floor entries first'
  category: public API/CLI contract
  rationale: every stage's retrieval output changes
  source: spec
- id: IRR-007
  decision: New CLI verb hm autopilot narrow --until <stage>
  category: public API/CLI contract
  rationale: new verb rendered templates call
  source: spec
- id: IRR-008
  decision: Autopilot marker gains a restore-pipeline field
  category: schema/file format/storage layout
  rationale: every marker reader must accept it
  source: spec
