irreversible_decisions:
- id: IRR-001
  decision: hm intent keeps status, show, new (--title-file --statement-file --metric,
    optional --scope-file --out-of-scope-file), close (--observed --note-file), metric
    measure/record, question add|observe|resolve (without --locator), migrate; removed
    verbs approve, activate, drop, reopen; removed flags --from-proposal, --candidates,
    --declined-file, --locator; the hm world module is removed; status --json top-level
    keys become state, purpose, metrics, intents, open_questions, open; status on
    an unmigrated layout returns invalid naming migrate
  category: public API/CLI contract
  rationale: Rendered skills, wrapup and user scripts call these; the removed parts
    only fed the approval state machine, the proposal path or the never-fired staleness
    check
  source: spec
- id: IRR-002
  decision: Goal record state written as open or closed; read proposed/active as open
    and closed/dropped as closed; approval, revisit_when, depends_on, rejected are
    not written on new records; existing entries and records keep every key they have
  category: schema/file format/storage layout
  rationale: Removes the approval hash that forced re-approval; old data stays readable
    and intact
  source: spec
- id: IRR-003
  decision: 'hm world_model digest intents becomes {"open": [{id, metric_id, last,
    target, gap}]}; open takes the old intents slot in the trim order'
  category: public API/CLI contract
  rationale: The rendered Maker skill briefs from it
  source: spec
