    < text_before(''## Step 1'', target).index(''For each matching objective:'') <
    text_before(''## Step 1'', target).index(''world objective revisit <objective-id>'')
    for target in (''claude'', ''codex'')) and text_before(''## Step 1'').index(''rejected'')
    < text_before(''## Step 1'').index(''For each matching objective:'') < text_before(''##
