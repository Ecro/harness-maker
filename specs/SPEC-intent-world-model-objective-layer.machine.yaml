    == ''candidate'' and revisit(CASE_UNMET).result == ''not_met'' and all(revisit(c).result
    == ''unevaluable'' for c in (CASE_NO_VALUE, CASE_STALE_DEF, CASE_CONFLICT, CASE_DANGLING))
    and run_cli([''world'', ''objective'', ''revisit'', ''OBJ-3'', ''--json''], cwd=FX_ROOT).stdout_json
    == {''objective'': ''OBJ-3'', ''title'': FX.obj3_title, ''condition'': FX.obj3_condition,
    ''last_value'': FX.obj3_last_value, ''result'': ''candidate'', ''blocked'': False}
