ac:
- id: AC-001
  title: Every tier-3 task discriminates, and its careless overlay fails hidden but
    passes visible
  type: property
  test_ids:
  - tests/unit/test_bench_tier3.py::test_tier3_tasks_discriminate
  - tests/unit/test_bench_tier3.py::test_tier3_ships_nine_tasks_in_four_families
  - tests/unit/test_bench_tier3.py::test_a_careless_overlay_that_passes_is_a_problem
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: The hidden tests and careless overlays are frozen before any arm runs and covered
    by tier3_hash; the DRI signs that hash before the hm arm runs.
  pending_test: false
  oracle_source: differential
  oracle_evidence: Each task's hidden tests are written from the cited sentence in
    its start-tree file or prompt (scripts/bench/tier3/base/docs/DECISIONS.md, docs/config.md,
    timeparse/pack.py, the session prompts), independent of the reference overlay;
    the careless/ overlay is the plausible-but-wrong path named in the approved DESIGN,
    so a reference that passes and a careless copy that fails are two independent
    witnesses that the tests measure the trap.
  oracle_independence_waiver: null
  input_domain: every task directory under scripts/bench/tier3/tasks/ (t13-t21)
  transformation: grade the grading tree (fixture + base + seed + every session overlay),
    the grading tree plus reference/, and the grading tree plus careless/, with the
    hidden tests and with the tree's own visible tests
  expected_relation: all(t fails on start for t in hidden - guards) and all(t passes
    on start for t in guards) and grade(reference).passed and visible(reference).passed
    and visible(start).passed and not grade(careless).passed and visible(careless).passed
    and ids == ['t13', 't14', 't15', 't16', 't17', 't18', 't19', 't20', 't21'] and
    guard_tasks == ['t21']
  preconditions: []
  observable_output: check_task problems per tier-3 task (empty list = sound)
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
