- id: AC-005
  title: A multi-session run is sequential fresh sessions on one work dir, graded once
  type: mechanical
  test_ids:
  - tests/unit/test_bench_tier3.py::test_sessions_run_in_order_as_fresh_processes_in_one_work_dir
  - tests/unit/test_bench_tier3.py::test_the_teammate_commit_holds_only_the_overlay_paths
  - tests/unit/test_bench_tier3.py::test_an_overlay_the_arm_already_wrote_is_recorded_as_clobbered
  - tests/unit/test_bench_tier3.py::test_a_failed_session_stops_the_run_and_grades_once
  executable_predicate: calls == [(work, prompt_1), (work, prompt_2)] and all('--continue'
    not in argv and '--resume' not in argv for argv in main_arm_argvs) and hm_prompts
    == ['/hm:spec ' + p for p in session_prompts] and teammate_commit_paths == overlay_paths
    and arm_file_uncommitted_after_teammate_commit and row['overlay_clobbered'] ==
    ['timeparse/locale.py'] and len(row['sessions']) == 2 and row['cost_usd'] == sum(s['cost_usd']
    for s in row['sessions']) and failed_row['stopped_at'] == 1 and len(failed_row['sessions'])
    == 1 and grades_per_run == 1 and solved_row['outcome'] == 'solved'
  golden_table: []
  rubric_id: null
  note: DESIGN §3. A session boundary is a fresh process, the case hm's persisted state
