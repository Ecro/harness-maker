- id: AC-004
  title: The SPEC plan fails closed on any non-pass
  type: parametric
  test_ids: []
  executable_predicate: null
  golden_table:
  - input:
      case: pytest exits 1
    expected: exit 1, no marker
    edge: false
    note: ''
  - input:
      case: pytest exits 5 (no tests collected)
    expected: exit 1, no marker
    edge: true
    note: ''
  - input:
      case: ruff configured and its command exits non-zero
    expected: exit 1, pytest not run, no marker
    edge: false
    note: ''
  - input:
      case: a gate exceeds --timeout-s
    expected: exit 1, no marker
    edge: false
    note: ''
  - input:
      case: .venv/bin/python cannot start, or the tool is not installed in it
    expected: exit 1, no marker
    edge: true
    note: no install, no fallback
  - input:
