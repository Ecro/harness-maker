irreversible_decisions:
- id: IRR-001
  decision: Add `--spec-slug <slug>` to `hm observability.verification_cache run`
  category: public API/CLI contract
  rationale: The rendered light check calls it; removing or renaming it breaks every harness
    rendered with it.
  source: spec
- id: IRR-002
  decision: run's stdout JSON gains `gate_source` ("spec") and `spec_slug` on the SPEC path;
    an absent `gate_source` means ci
  category: public API/CLI contract
  rationale: Rendered prose copies `gate_source` into the light-check record; once harnesses
    read the key it cannot be renamed or dropped.
  source: spec
- id: IRR-003
  decision: Add the optional field `test_framework` to the SPEC approval stamp, recorded by
    `approve` from the `.md` frontmatter (human and --exempt), outside the content hash and
    excluded from approve's stdout
  category: schema/file format/storage layout
  rationale: Every new stamp carries it and the SPEC plan trusts only it; removing it later
    turns every SPEC plan off. Additive and inside `approval`, which the hash excludes, so no
    stamp is released.
  source: spec
- id: IRR-004
  decision: Verification cache markers written by a SPEC plan carry `gate_source` spec,
    `spec_slug` and `test_framework`; a marker without `gate_source` means ci
  category: schema/file format/storage layout
  rationale: is_run_fresh, light_check_passed and check's printed marker depend on the
    absent-means-ci rule, so CI markers can never gain the key without changing every reader.
  source: spec
- id: IRR-005
  decision: The light-check record REVIEW-{slug}-{date}.md gains top-level `gate_source` (ci
    or spec); absent means ci
  category: schema/file format/storage layout
  rationale: Wrapup commits the record into history and the boundary compares it with the
    marker, so the key and its absent-means-ci reading persist.
  source: spec
