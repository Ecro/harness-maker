- id: AC-003
  title: Only a trusted pytest SPEC with a project .venv yields a plan
  type: mechanical
  test_ids: []
  executable_predicate: all(run_spec(fixture, slug)['exit'] == expected for fixture,
    slug, expected in TRUST_TABLE)
  golden_table:
  - input:
      case: no CI file, lane light, exempt, irreversible [], md test_framework pytest,
        .venv/bin/python, passing suite
    expected: 0
    edge: false
    note: also asserts gate_source == spec, commands == ['<py> -m pytest'], and a
      writer run marker
  - input:
      case: same, approved by a human stamp
    expected: 0
    edge: false
    note: ''
  - input:
      case: lane full, approved
    expected: 3
    edge: false
    note: ''
  - input:
      case: lane light, no approval (missing)
    expected: 3
    edge: false
    note: ''
  - input:
      case: lane light, machine yaml edited after approval (invalid)
    expected: 3
    edge: false
    note: ''
  - input:
      case: lane light, approved, irreversible [IRR-001]
    expected: 3
    edge: false
    note: ''
  - input:
      case: md test_framework in {Pytest, 'pytest ', pytest + hypothesis, unittest,
        '', missing, non-string}
    expected: 3
    edge: true
    note: closed map, exact match
  - input:
      case: no .venv/bin/python
    expected: 3
    edge: false
    note: no PATH fallback
  - input:
      case: pyproject.toml does not parse
    expected: 3
    edge: true
    note: ''
  - input:
      case: slug '..', containing '/', or no SPEC for the slug
    expected: 3
    edge: true
    note: ''
  - input:
      case: a passing SPEC run, then the SPEC made invalid with spec.dir under work-docs/
        (outside the relevant key), then run again
    expected: 3
    edge: true
    note: trust is checked before freshness; the second run must not report cached
      true
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: golden
  oracle_evidence: 'The rows come from the trust rule this SPEC fixes before code:
    light_lane.lane_of == light (stage 3a''s reader, already pinned by its own table)
    AND md test_framework == ''pytest'' AND <root>/.venv/bin/python exists AND pyproject
    parses; every 3 row also asserts commands [] and no marker file.'
