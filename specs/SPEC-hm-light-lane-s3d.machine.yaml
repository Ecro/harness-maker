- id: AC-002
  title: The SPEC plan's command list is the golden function of the project's configuration
  type: parametric
  test_ids: []
  executable_predicate: null
  golden_table:
  - input:
      case: no [tool.ruff], no [tool.mypy]
    expected:
    - <py> -m pytest
    edge: false
    note: the timeparse shape
  - input:
      case: '[tool.ruff], no [tool.mypy]'
    expected:
    - <py> -m ruff check .
    - <py> -m pytest
    edge: false
    note: ''
  - input:
      case: '[tool.mypy] without files, no [tool.ruff]'
    expected:
    - <py> -m mypy .
    - <py> -m pytest
    edge: false
    note: ''
  - input:
      case: '[tool.mypy] with files, no [tool.ruff]'
    expected:
    - <py> -m mypy
    - <py> -m pytest
    edge: false
    note: ''
  - input:
      case: '[tool.ruff.lint] only, [tool.mypy] with files'
    expected:
    - <py> -m ruff check .
    - <py> -m mypy
    - <py> -m pytest
    edge: true
    note: a subtable implies the ruff key
  - input:
      case: '[tool.ruffx] or [tool.mypy_extra] only'
    expected:
    - <py> -m pytest
    edge: true
    note: only the exact ruff and mypy keys count
  - input:
      case: pyproject.toml absent
    expected:
    - <py> -m pytest
    edge: true
    note: nothing configures ruff or mypy
  - input:
      case: root path containing a space
    expected: every command starts with the shell-quoted <py>, and shlex.split yields
      it as one token
    edge: true
    note: ''
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: golden
  oracle_evidence: The rows are fixed from the DRI's 2026-10-15 option ("test_framework
    plus ruff/mypy only if pyproject configures them") and the coordinator's interpreter
    rule before any code; <py> is the literal absolute path <root>/.venv/bin/python
