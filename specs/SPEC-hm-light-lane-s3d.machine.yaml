irreversible_decisions:
- id: IRR-001
  decision: Add `--spec-slug <slug>` to `hm observability.verification_cache run`
  category: public API/CLI contract
  rationale: The rendered light check calls it; removing or renaming it breaks every
    harness rendered with it.
  source: spec
- id: IRR-002
  decision: run's stdout JSON gains "gate_source" "spec" on the SPEC path only; a
    CI-derived run prints no new key and the slug is not echoed
  category: public API/CLI contract
  rationale: The light check reads it to name the source in the record body; once
    harnesses read the key it cannot be renamed or dropped.
  source: spec
