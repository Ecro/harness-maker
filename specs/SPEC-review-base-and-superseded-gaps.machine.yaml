- id: AC-001
  title: A zero-commit task branch resolves review_base to HEAD
  type: mechanical
  test_ids:
  - tests/unit/test_freeze_commit.py::test_review_base_is_head_on_a_task_branch_with_no_own_commits
  executable_predicate: resolve_review_base(repo) == git('rev-parse', 'HEAD') == git('merge-base',
    'HEAD', 'main') and frozen_diff_paths(repo) == {'untracked.txt'}
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: golden
  oracle_evidence: The per-task model commits only at wrapup (one squash commit per
    task), so a zero-commit task branch's whole diff is its working tree against the
    fork point; The expected commit is computed by git itself (`git rev-parse HEAD`,
    `git merge-base HEAD main`, `HEAD~1`) over a throwaway repo whose topology the
    test builds by hand, so the assertion is not read back out of resolve_review_base.
  oracle_independence_waiver: null
