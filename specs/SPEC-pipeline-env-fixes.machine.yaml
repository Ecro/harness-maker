irreversible_decisions:
- id: IRR-001
  decision: Every rendered harness-maker invocation (stage hm prefix, hooks, skills,
    commands, plugin-root commands/skills/hooks) is spelled `uv run --no-project --with
    <ref> …`
  category: public API/CLI contract
  rationale: The prefix is typed by the model and matched by user permission rules;
    changing it again costs every user a re-render.
  source: spec
- id: IRR-002
  decision: The rendered permissions.allow grants move to the new prefix and the old-prefix
    harness grants are pruned on re-render
  category: security/permission boundary
  rationale: A grant is a permission boundary; pruning must match only what harness-maker
    itself rendered.
  source: spec
- id: IRR-003
  decision: task-preflight and task-refresh accept a linked worktree as their base
    argument and act on its main checkout
  category: public API/CLI contract
  rationale: Stage text and user scripts may come to rely on calling them from the
    worktree.
  source: spec
