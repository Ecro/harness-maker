  - tests/unit/test_world_gap.py::test_ac_001_cli_gap_on_the_skeleton_prints_not_filled_in
  executable_predicate: all(row['reason'] in ('never_measured', 'stale_definition',
    'measured') and 'how_measured' in row for row in world.gap_report(root)['outcomes'].values())
    and {k for k in world.gap_report(root)['objectives']} == set(world.load_world(root).objectives)
    and all(world.gap_report(root)['outcomes'][o]['gap'] == world.status_report(root)['outcomes'][o]['gap']
    for o in world.status_report(root)['outcomes'])
