    2/3 enrolled with assessments={} and state that implementation completion does
    not establish field-trial success, satisfying the rubric''s ban on repair-assisted
    execution or fixtures standing in for three real successful tasks. The rendered
    workflow-feedback.md.j2 (L52-104) wires the same blocked/resume/readback obligation
    into the generated procedure (recovery next-trigger record, explicit record-decision
    requirement, never deriving pass/fail from task success), so the reported behavior
