- id: AC-009
  title: Workflow integration demonstrates unprompted recovery
  type: judgment
  test_ids: []
  executable_predicate: null
  golden_table: []
  rubric_id: intent_feedback_continuity
  note: ''
  pending_test: true
  oracle_source: rubric
  oracle_evidence: Independent rubric intent_feedback_continuity was authored from
    this user interview and the existing field-trial contract before implementation.
    Judge captured tool actions, conversation and pre/post artifacts, never a model
    summary or implementation-derived success flag.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions: []
  observable_output: null
  generator_hint: null
  judgment_verdict: pass
  judged_at: '2026-09-28'
  judgment_evidence: AC-009's single applicable rubric criterion (native_recovery)
    is grounded in real, independently replayable evidence rather than a self-reported
    summary. The primary native capture (tests/fixtures/intent_feedback_continuity_native_observed.json,
    produced by the live-Codex-CLI runner tests/fixtures/intent_trial_native_runner.py.txt)
    shows session A writing trial_feedback frontmatter and exiting, then a separate
    session B — instructed only to 'resume the existing task and report its next action'
    with an explicit 'No one has asked you to repair a trial' — independently discovering
    and calling the real `hm intent ... trial reconcile` CLI path, changing the trial
    cohort from `[]` to `[a]`; a same-environment control with the owning stage-entry
    trigger removed leaves the trial file byte-identical to the pre-B hash and contains
    no reconcile call (asserted in tests/integration/test_intent_trial_native_evidence.py:47-53).
    Three further native captures in tests/fixtures/intent_feedback_continuity_native_edge_observed.json
    independently cover closeout (terminal event recorded, hash changed, reconcile
    called), revoked policy authority (no reconcile, hash unchanged, `authority_required`),
    and an unavailable registered source (no reconcile, hash unchanged, `source_incomplete`),
    each replayed by its own assertion in test_intent_trial_native_evidence.py. A
    dedicated render test proves the identical CLI commands are rendered into both
    supported hosts' procedure files (Codex `.agents/skills/...` and Claude Code `.claude/skills/...`).
    Research/spec-without-PLAN and intermediate-handoff are not isolated as separate
    fixtures but are structurally present in the same main run (task `a` never acquires
    a PLAN and its RESEARCH-a.md never gains an `a-terminal` event across the handoff),
    which is a defensible but comparatively thinner form of coverage than the four
    dedicated fixtures. EVIDENCE-intent-feedback-continuity.md explicitly disclaims
    that these are isolated workflow trials and not proof the real three-task field
    trial passed, satisfying the rubric's non-inference requirement.
  judgment_subject_paths:
  - work-docs/PLAN-intent-feedback-continuity.md
  - work-docs/EVIDENCE-intent-feedback-continuity.md
  - src/harness_maker/templates/skills/intent-layer/references/workflow-feedback.md.j2
  - src/harness_maker/templates/codex/stage_skill.md.j2
  judgment_subject_hash: 7547a9ba6065013686bff94ead57c3595605580fa68fd6ea002f4163eb6c1f30
