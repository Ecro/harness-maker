verification_tier: 2
mutation_threshold: 70
mutation_threshold_rationale: tier 2 — the changed Python is aggregation arithmetic over
  ledger rows (bucket by model, bucket by stage, exclude a stage, apply an exclusions
  file), which is exactly where a wrong aggregation key survives a shape-only assertion.
  CLAUDE.md records this class as having already shipped a 30x mis-measurement on this
  very ledger family (a hand aggregation reported 61.3% where the shipped reader reported
  2.15%). Not tier 1 — none of this sits on /hm:execute's hot path. 70 rather than 85
  because the same modules also hold path resolution and file I/O that these tests cannot
  reach.
