  - tests/unit/test_ledger_exclusions_call_sites.py::test_the_rollup_seam_applies_exclusions
  executable_predicate: rollup(fixture_ledger).by_model["codex"]["invoked"] == 4 and rollup(fixture_ledger).total
    == 6 and "work-docs/BASELINE-ledger-rollup.md" in committed_paths_at_head()
  golden_table: []
  rubric_id: null
  pending_test: false
  oracle_source: golden
  oracle_evidence: The fixture is hand-authored so that FOUR distinct mis-aggregations each
    produce a different number — merging models, dropping failed rows, counting disposition
    rows as invocations, and skipping the exclusions file — so every expected value is
    computed by hand from the file and never by a second call to the aggregator. Three of
    the four are mistakes CLAUDE.md records as having shipped on this ledger family.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions: []
  observable_output: null
  generator_hint: null
  note: The total == 6 arm is the disposition discriminator — finding_ref is the only thing
    separating per-invocation rows from per-finding rows and both carry status invoked, so a
    naive aggregator reports more than 6. The third conjunct proves COMMITTING, not staging —
    git clone transfers commits and never index state, so the check is git ls-tree at HEAD
    plus git check-ignore --no-index, and the roll-up must be named in wrapup_land's typed
    manifest because the worktree-sweep that would otherwise catch it records
    skipped-not-isolated when the worktree IS the base (risk R3).
