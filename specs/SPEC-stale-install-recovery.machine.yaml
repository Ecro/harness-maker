- id: IRR-001
  decision: A push to main that changes the four version files tags vX.Y.Z and publishes
    to PyPI and GitHub Release with no human step
  category: security/permission boundary
  rationale: DRI accepted 2026-11-19; a version bump is a deliberate release commit,
    quality-gate runs first, and a missed tag (0.65.6) cost more than the removed
    step. Publishes are immutable.
  source: spec
