irreversible_decisions:
- id: IRR-001
  decision: Add spec_machine finalize, --slug and --write to export-golden, --slug
    to mark-tested with all testable ACs as the default when no --ac is given, and
    a default manifest to wrapup_land when no --required/--optional is given. Additive
    only.
  category: public API/CLI contract
  rationale: Rendered harnesses in user projects will call these; once shipped they
    cannot be renamed without breaking those renders.
  source: spec
