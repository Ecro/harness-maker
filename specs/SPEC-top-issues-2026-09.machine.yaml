irreversible_decisions:
- id: IRR-001
  decision: 'Persisted review payloads carry caused_by in {none, unknown, fix-r<N>}
    written by review_churn attribute; REVIEW grammar changes from #N to the same
    literals'
  category: schema/file format/storage layout
  rationale: the payload corpus is append-only history; readers will key on these
    literals
  source: spec
- id: IRR-002
  decision: New CLI verbs review_churn attribute (requires --run-id), review_churn
    fix-defect-rate, observability.verification_cache run (exit 0/1/3/4)
  category: public API/CLI contract
  rationale: rendered templates in every consumer harness call them by name and branch
    on the exit codes
  source: spec
- id: IRR-003
  decision: Verification markers gain writer and commands_sha256; run treats markers
    without writer=run and the matching hash as not fresh
  category: schema/file format/storage layout
  rationale: markers are shared across harness versions in ~/.cache/harness-maker/verify
  source: spec
