- id: AC-002
  title: understanding block classifier matches the golden table
  type: parametric
  test_ids:
  - tests/unit/test_understanding_block.py::test_ac_002_classifier_matches_golden_table
  executable_predicate: null
  golden_table:
  - input:
      message: 'feat: x


        why


        Understanding: none

        '
    expected:
      status: none
      bullets: 0
    edge: false
    note: ''
  - input:
      message: 'feat: x


        Understanding:

        - a -> b

        '
    expected:
      status: ok
      bullets: 1
    edge: false
    note: ''
  - input:
      message: 'feat: x


        Understanding:

        - a

        - b

        - c

        - d

        - agent-decided: ADR-001

        '
    expected:
      status: ok
      bullets: 5
    edge: true
    note: exactly at the cap, agent-decided line counts
  - input:
      message: 'feat: x


        Understanding:

        - a

        - b

        - c

        - d

        - e

        - f

        '
    expected:
      status: too_long
      bullets: 6
    edge: true
    note: ''
  - input:
      message: 'feat: x


        Understanding:


        Co-Authored-By: C <n@x>

        '
    expected:
      status: empty
      bullets: 0
    edge: false
    note: ''
  - input:
      message: 'feat: x


        why only

        '
    expected:
      status: missing
      bullets: 0
    edge: false
    note: ''
  - input:
      message: 'feat: x'
    expected:
      status: missing
      bullets: 0
    edge: true
    note: subject-only message
  - input:
      message: 'feat: Understanding: none


        why

        '
    expected:
      status: missing
      bullets: 0
    edge: true
    note: the header in the subject line does not count
  - input:
      message: 'feat: x


        Understanding:

        - a -> b


        Co-Authored-By: C <n@x>

        '
    expected:
      status: ok
      bullets: 1
    edge: false
    note: bullets stop at the blank line before trailers
  - input:
      message: 'feat: x


        Understanding:


        - a -> b

        - unknown: c

        '
    expected:
      status: ok
      bullets: 2
    edge: false
    note: blank line between header and bullets is allowed
  - input:
      message: 'feat: x


        Understanding: foo

        - a

        '
    expected:
      status: malformed
      bullets: 0
    edge: true
    note: header with a suffix other than none
  - input:
      message: 'feat: x


        Understanding: none

        - a

        '
    expected:
      status: malformed
      bullets: 0
    edge: true
    note: none followed by bullets
  - input:
      message: 'feat: x


        Understanding:

        - a


        Understanding: none

        '
    expected:
      status: malformed
      bullets: 0
    edge: true
    note: duplicate headers
  - input:
      message: 'feat: x


        Understanding:

        - a

        plain text

        - b

        '
    expected:
      status: ok
      bullets: 1
    edge: false
    note: the run ends at the first non-bullet line
  - input:
      message: "feat: x\n\nUnderstanding: none   \n"
    expected:
      status: none
      bullets: 0
    edge: false
    note: trailing whitespace on the header is ignored
  - input:
      message: 'feat: x


        understanding: none

        '
    expected:
      status: missing
      bullets: 0
    edge: true
    note: case-sensitive header
  - input:
      message: 'feat: x


        Understanding:

        - agent-decided: none (unmarked: 3)

        '
    expected:
      status: ok
      bullets: 1
    edge: false
    note: legacy PLAN with only unmarked ADRs
