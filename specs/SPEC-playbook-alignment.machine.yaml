    code fences, lines that look like frontmatter fences'
  transformation: write a valid INTENT file with that body, then apply one writer
    from {approve, activate, drop, reopen, close, edit_objective} whose precondition
    holds
  expected_relation: body_bytes_after == body_bytes_before
  preconditions:
