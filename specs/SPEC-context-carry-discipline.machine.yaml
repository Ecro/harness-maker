  executable_predicate: all(marker_body(rerendered, m) == marker_body(original, m)
    for m in ("hm:user:project-rules", "hm:user:extensions"))
  golden_table: []
  rubric_id: null
  note: The existing block-merge contract, asserted against this specific change rather
    than assumed to hold. Adding a new `##` section to a template is exactly the kind
    of edit that can shift marker boundaries, and CLAUDE.md checkpoint 1 (user-state
    preservation) makes this the first question to ask of any write to a user file.
  pending_test: false
  oracle_source: differential
  oracle_evidence: The reference is the pre-render marker body, captured before the
    render runs. The comparison is against the user's own prior content, not against
    an expectation authored alongside the change.
