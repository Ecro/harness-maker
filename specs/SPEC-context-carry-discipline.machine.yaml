- id: AC-005
  title: the instruction states and bounds its own cost
  type: mechanical
  test_ids:
  - tests/render/test_render_context_discipline.py::test_the_instruction_stays_inside_its_own_budget
  executable_predicate: all(len(discipline_section(render(preset, locale))) <= 2000
    for preset in ("Production", "Side") for locale in ("en", "ko"))
  golden_table: []
  rubric_id: null
  note: 2000 characters is roughly 550 tokens, against a claimed 17.3% of carried
    context. The cap exists because this SPEC's whole argument is that instruction
    bytes are real bytes — Phase 3 spent 3,765 characters against an unmeasured saving,
    and a criterion that did not bound its own cost would repeat that without noticing.
    Characters, and `len()`, for the same UTF-8 reason as the fused-command ratchet.
  pending_test: false
  oracle_source: golden
  oracle_evidence: 2000 is a budget chosen up front and recorded here before the section
    is written, so the section is measured against a prior constraint rather than
    the constraint being fitted to whatever was written.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions: []
  observable_output: the character length of the discipline section in each variant
  generator_hint: null
