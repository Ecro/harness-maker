ac:
- id: AC-001
  title: the rules render into every preset and locale
  type: mechanical
  test_ids:
  - tests/render/test_render_context_discipline.py::test_both_rules_render_in_every_preset_and_locale
  executable_predicate: all(has_search_rule(render(preset, locale)) and has_rewrite_rule(render(preset,
    locale)) for preset in ("Production", "Side") for locale in ("en", "ko"))
  golden_table: []
  rubric_id: null
  note: 'Four variants, asserted individually. A single-variant check is the canonical
    way this repo has shipped a half-applied template change: the en/Production path
    is the one anyone renders while developing, so a ko or Side omission is invisible
    until a user hits it. The two predicates are separate because the two rules are
    separate — a section that carries only the search rule must fail, not pass on
    the section existing.'
  pending_test: false
  oracle_source: differential
  oracle_evidence: The reference is the template source, which is edited independently
    of the assertion; the rendered output is produced by the shipped renderer. Neither
    side of the comparison is generated by the code under test.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - all four preset x locale templates exist
  observable_output: the rendered CLAUDE.md text for each preset x locale
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
- id: AC-002
  title: each rule names a tool and a concrete limit or alternative
  type: mechanical
  test_ids:
  - tests/render/test_render_context_discipline.py::test_the_search_rule_names_its_tools_and_a_concrete_bound
  executable_predicate: names_tools(search_rule_text) and has_concrete_bound(search_rule_text)
    and "Edit" in rewrite_rule_text and mentions_prior_read(rewrite_rule_text)
  golden_table: []
  rubric_id: null
  note: 'This is the arm that stops the criterion degrading into "a section exists".
    An instruction that says "be mindful of context" satisfies AC-001 and changes
    nothing. `has_concrete_bound` requires a numeral or an explicit flag/limit token
    in the search rule; `mentions_prior_read` requires the rewrite rule to state the
    condition under which Edit is preferred (the file is already in context from a
    Read), because "prefer Edit" without the condition is false — 69% of Write bytes
    create new files and must not be discouraged. The negative arm is the load-bearing
    half: a mutation that replaces the rule text with an exhortation must fail this
    AC while still passing AC-001.'
  pending_test: false
  oracle_source: differential
  oracle_evidence: The required tokens are derived from the RESEARCH document's measured
    command kinds (rg/grep, cat/head/ls/find) and from the Write-after-Read finding,
    both recorded before this SPEC was written and independent of the template text.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - AC-001 passes, so a section exists to inspect
  observable_output: the text of each rule within the rendered section
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
- id: AC-003
  title: harness-maker carries its own rule
  type: mechanical
  test_ids:
  - tests/render/test_render_context_discipline.py::test_this_repo_carries_its_own_rule
  executable_predicate: has_search_rule(repo_claude_md()) and has_rewrite_rule(repo_claude_md())
  golden_table: []
  rubric_id: null
  note: This repo's CLAUDE.md is hand-maintained and is NOT produced by templates/claude-md/,
    so AC-001 says nothing about it. The entire 23.0M-char measurement came from this
    repo; shipping the rule to every user harness while the repo that generated the
    evidence does not follow it would be the plainest possible version of the gap
    this SPEC exists to close.
  pending_test: false
  oracle_source: differential
  oracle_evidence: The rule text is compared against the same predicates AC-001 applies
    to the rendered output, so the two surfaces are held to one definition rather
    than each to its own.
  oracle_independence_waiver: null
