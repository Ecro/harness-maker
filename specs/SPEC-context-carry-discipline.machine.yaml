- id: AC-004
  title: the composition measurement is committed and re-runnable
  type: mechanical
  test_ids:
  - tests/unit/test_economics_composition.py::test_write_after_read_duplication_is_computed_not_summed
  executable_predicate: set(composition(fixture_transcripts).keys()) >= {"by_category",
    "by_bash_kind", "write_after_read"} and composition(fixture_transcripts)["write_after_read"]["duplicate_chars"]
    == known_duplicate_chars(fixture_transcripts)
  golden_table: []
  rubric_id: null
  note: 'This AC is what makes a prose-only instruction falsifiable AFTER the fact,
    and it is the reason it is in scope. The user chose prose with no enforcement
    hook; without a committed measurement the instruction would ship a certain cost
    against a benefit nobody could ever check — the exact shape of PLAN-token-economy-step-pruning
    Phase 3. The second conjunct is the non-vacuity arm: a fixture with a hand-counted
    duplicate figure, so the subcommand must compute the number rather than merely
    return a well-shaped dict. Fixture, not live transcripts — the developer''s own
    ~/.claude is not a test input.'
  pending_test: false
  oracle_source: golden
  oracle_evidence: The fixture transcript's duplicate-byte count is hand-derived from
    the fixture content, which is authored for the test and fixed. It is an observed
    prior value, not a value produced by the subcommand under test.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - a transcript fixture exists containing at least one Write of a path Read earlier
    in the same session, without which the duplication arm cannot bite
  observable_output: the JSON emitted by `economics composition`
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
