irreversible_decisions:
- id: IRR-001
  decision: 'Under a SPEC the DRI approved (not --exempt), these intent writes need
    no per-write yes: question add --status open, question observe --relation confirms
    or contradicts, metric measure, and metric record with an --evidence-file taken
    from this task''s artifacts. Every other intent write still needs one (question
    add --status confirmed or wrong, question observe --relation supersedes, question
    resolve, new, approve, activate, drop, reopen, close), as does every intent write
    under an exempt SPEC.'
  category: security/permission boundary
  rationale: The DRI asked for it on 2026-11-10. A plain record adds an observation
    and changes no verdict, and the DRI saw the intent link when approving the SPEC.
    A verdict, a superseded claim or a lifecycle step changes what the project believes
    or is trying to do. Rendered harnesses in the field change behaviour on upgrade.
  source: spec
