  executable_predicate: row["skip_reason"].startswith("agy-empty-response") and row["status"]
    == "failed"
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: differential
  oracle_evidence: Three fabricated agy envelopes — SUCCESS+empty, SUCCESS+valid structured_output,
    and a non-SUCCESS status — must produce three distinguishable rows. The discriminating
    power is checked across the set, so a token that collapses two classes fails even
    though each row alone looks correct.
