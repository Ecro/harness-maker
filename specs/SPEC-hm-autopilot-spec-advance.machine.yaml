- id: AC-001
  title: auto_full Step 5 says the stage advances without an approval
  type: mechanical
  test_ids:
  - tests/render/test_render_spec_autopilot_advance.py::test_auto_full_step5_says_the_stage_advances
  executable_predicate: >-
    all('autopilot stops at this stage' not in step5[t] and 'does not end this stage
    by itself' in step5[t] and '`proceed: true` advances WITHOUT an approval' in step5[t]
    and '`/hm:wrapup` asks again before landing' in step5[t] for t in ('claude', 'codex'))
    and tail(step5['claude']) == tail(step5['codex'])
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: golden
  oracle_evidence: The false claim is the d48bdc0 sentence the 2026-10-14 bench runs
    quoted back ("no approval to advance on, so I stopped here"). What auto_full does
    is fixed by the boundary, not the template, and is already pinned by
    tests/unit/test_autopilot_judgment_gate.py::test_auto_full_proceeds_through_a_pending_gate
    (proceed true on a pending gate), so the expected wording follows from code this
    task does not change.
