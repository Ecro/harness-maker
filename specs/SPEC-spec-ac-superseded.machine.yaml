irreversible_decisions:
- id: IRR-001
  decision: Add an optional AC field superseded_by (a spec slug) to .machine.yaml,
    excluded from the approval hash and checked at validate time for grammar and target
    existence
  category: schema/file format/storage layout
  rationale: Landed SPECs will carry it, and it moves waiver authority — a tooling
    field removes an approved obligation without re-approval. Validate catches malformed
    or dangling values; "only retire writes it" stays a convention a hand edit naming
    an existing SPEC can still pass.
  source: spec
- id: IRR-002
  decision: Add the CLI verb `hm spec_machine retire --yaml --ac (--by <slug> | --clear)`
  category: public API/CLI contract
  rationale: Operators and later stage templates call it by name with these refusal
    and no-op semantics; renaming it or changing its flags breaks them.
  source: spec
