  oracle_source: property
  oracle_evidence: Approval is a hash of authored fields; a tooling-only edit must
    leave it invariant whatever the AC content, so the relation holds independently
    of how retire is implemented. The pre-operation hash is captured from the stored
    stamp, not recomputed by the code under test.
  oracle_independence_waiver: null
