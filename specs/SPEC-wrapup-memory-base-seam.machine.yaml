- id: AC-002
  title: memory fold is idempotent on re-run
  type: property
  test_ids:
  - tests/unit/test_wrapup_memory_fold.py::test_fold_memory_idempotent_noop
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'idempotence is a metamorphic relation: fold(fold(state)) == fold(state).
    A second invocation on a clean memory tree must create no commit and leave HEAD
    unchanged — this holds for any correct implementation, so it cannot be satisfied
    by reading the code.'
  oracle_independence_waiver: null
  input_domain: a base repo whose memory tiers are already committed into HEAD (clean
    working tree)
  transformation: invoke the memory-fold helper a second time
  expected_relation: HEAD sha is unchanged AND no new commit is created AND exit code
    == 0
  preconditions:
  - a prior fold has already committed the memory tiers
  observable_output: process exit code + base branch HEAD sha
