- id: AC-005
  title: fold refuses an unexpected HEAD or foreign staged content
  type: mechanical
  test_ids:
  - tests/unit/test_wrapup_memory_fold.py::test_fold_refuses_unexpected_head_or_foreign_staged
  executable_predicate: commit_base_memory(base, expect_head='deadbeef') != 0 and
    git_head(base) == head_before
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'safety invariant (refusal): when HEAD != expect_head OR a non-tier
    path is staged, the helper must NOT amend — HEAD sha is unchanged and exit is
    non-zero. This is an independent invariant (no amend may mutate a commit the caller
    did not authorize), provable by comparing HEAD before/after regardless of the
    helper''s internals.'
  oracle_independence_waiver: null
  input_domain: a base repo whose HEAD is not the expected fresh squash, or whose
    index has a staged non-tier path
  transformation: invoke commit_base_memory with the fresh-squash expect_head
  expected_relation: exit code != 0 AND base HEAD sha is unchanged AND no foreign
    path is committed
  preconditions:
  - the base index may carry a concurrent session's staged churn
  observable_output: process exit code + base HEAD sha + committed tree
