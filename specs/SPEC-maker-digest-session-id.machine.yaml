  executable_predicate: null
  golden_table:
  - input:
      newest_row_session: s1
      substituted: s1
    expected:
      other_session: false
    edge: false
    note: S1 same session
  - input:
      newest_row_session: s1
      substituted: s2
    expected:
      other_session: true
    edge: false
