- id: AC-010
  title: the Phase D.5 repair guard carries operative force
  type: judgment
  test_ids: []
  executable_predicate: null
  golden_table: []
  rubric_id: repair_guard_force
  note: ''
  pending_test: false
  oracle_source: rubric
  oracle_evidence: 'ADR-003 requires proof that the step DEMANDS something rather
    than merely reading like guidance, and it explicitly rejected a sentence-grep
    because ''a fixed sentence is satisfiable by a sentence with no operative force''.
    Two mechanical mutation controls were attempted and both were circular: deleting
    the grepped literal, and replacing it with a paraphrase, turn the predicate red
    for the same construction-level reason. Operative force is semantic, so the oracle
    is an INDEPENDENT reviewer against the named rubric repair_guard_force, whose
    criteria were written from the four recorded recurrences of [fail:code] fix-introduced-defect-passes-all-gates,
    not from the step being judged. The builder does not supply the verdict; judgment-reviewer
    does, and mark-judged stores a subject hash so a later edit to the step invalidates
    the pass.'
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions: []
  observable_output: null
  generator_hint: null
  judgment_verdict: pass
  judged_at: '2026-08-05'
  judgment_evidence: 'All six criteria pass on the Phase D.5 section of src/harness_maker/templates/stages/execute.md.j2
    (lines 368-403). demands_a_written_artifact: :381-382 names the destination and
    marks it "a **written** artifact, not a reflection". rejects_the_empty_answer:
    :387-388 supplies the concrete non-answer "''The bug no longer happens'' is not
    a window; it is the absence of one", with a second at :390-392. carries_a_blocking_consequence:
    :393-397 gives the unanswerable case a terminal instruction — "STOP and say so
    explicitly. Do not advance the phase on the strength of a green Phase D" — with
    the only alternative being a blocker that must name the window from (1), and "Silence
    here is the failure mode" closing the no-op path; this is a stop, not an encouragement.
    distinguishes_the_new_risk_from_the_old_symptom: :390-392 states outright that
    a test proving only the reported bug is gone is insufficient. is_scoped_so_it_does_not_fire_on_everything:
    :368-372 gives trigger (a repair), skip case (pure new-feature work, with a one-line
    receipt) and the unclear-case rule ("When in doubt, run it"). covers_the_absent_input_case:
    :399-403 requires the absent-case behaviour be stated as default/migration/explicit
    skip and covered, warning that a present-case-only fixture means the fix never
    fires. No criterion rests on heading text alone; each is grounded in an operative
    sentence in the body.'
  judgment_subject_paths:
