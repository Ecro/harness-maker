- id: AC-005
  title: no task branch still yields a graceful degrade
  type: mechanical
  test_ids: []
  executable_predicate: all(run(argv, cwd=repo_on_main).returncode == 0 and run(argv,
    cwd=repo_on_main).stdout_json["status"] == "degraded" and "slug" in run(argv, cwd=repo_on_main).stdout_json["verdict"]["missing"]
    for argv in (rendered_brief_argv(slug="absent-task"), rendered_brief_argv_without_slug()))
  golden_table: []
  rubric_id: null
  note: 'The negative arm of AC-004, and the reason the pair is not one AC. A fix that
    simply resolved some worktree from any cwd would turn AC-004 green while silently
    breaking the standalone and recovered wrapup, which wrapup_brief''s own docstring
    calls a supported path and which returns exit 0 deliberately so the degrade is
    not a halt. Asserting the exit code as well as the status is what stops a future
    change from converting the degrade into an error. BOTH standalone shapes are required:
    a slug naming a task with no worktree, and no slug argument at all. The second
    is the backward-compatibility arm — an un-re-rendered harness keeps calling without
    the flag, and ADR-001 promises that path is unchanged, so a predicate covering only
    the first would let a regression there ship silently.'
  pending_test: true
  oracle_source: differential
  oracle_evidence: The expected degrade shape is fixed by wrapup_brief's existing published
    contract (exit 0, status degraded, missing names the underivable field), which
