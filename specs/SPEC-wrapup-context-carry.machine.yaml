- id: AC-003
  title: collapsing preserves context per turn and divides carry
  type: property
  test_ids: []
  executable_predicate: mean_context(collapse(group)) == context_of(group[0]) and
    carry_usd(collapse(group)) * len(group) == carry_usd(group)
  golden_table: []
  rubric_id: null
  note: 'A metamorphic relation, so it needs no reference output and cannot be satisfied
    by reading the implementation. It also pins the exact claim this SPEC makes to
    the reader — that the correction moves dollars but NOT mean_context_tokens — so
    if a future change to the collapse breaks that invariant, the document and the
    code fail together rather than drifting apart. Hypothesis ci profile per PLAN-spec-tetrad
    ADR-002.'
  pending_test: true
  oracle_source: property
  oracle_evidence: The relation holds by construction of the artifact regardless of
    implementation — the split records carry byte-identical usage, so their mean over
    any grouping is the shared value, and the cache_read total is exactly proportional
    to the number of rows retained. No reference implementation and no golden value
    is involved.
  oracle_independence_waiver: null
  input_domain: groups of 1..8 synthetic assistant records sharing one message.id,
    with usage fields drawn from non-negative integers
  transformation: collapse the group to a single row keyed on message.id
  expected_relation: mean context tokens is invariant under collapse; cache_read cost
    scales by exactly 1/len(group)
  preconditions:
  - every record in a group carries identical usage, which is the artifact's observed
    shape
  observable_output: mean_context_tokens and cache_read_usd before and after collapse
  generator_hint: vary group size including the degenerate size 1, where collapse must
    be the identity
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
