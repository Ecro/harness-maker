- id: AC-006
  title: every derivation writes exactly one ledger row
  type: mechanical
  test_ids: []
  executable_predicate: len(ledger_rows(after_one_degrade)) == 1 and ledger_rows(after_one_degrade)[0]["reason"]
    == verdict.reason and len(ledger_rows(after_two_degrades)) == 2 and len(ledger_rows(after_one_success))
    == 1 and ledger_rows(after_one_success)[0]["status"] == "ok"
  golden_table: []
  rubric_id: null
  note: 'Exactly one row, not at-least-one: a per-call row is what makes "16 runs,
    2 fired" computable, and a writer that rewrites in place or appends per retry destroys
    the denominator. The second-degrade arm is the append check. Reason equality rather
    than truthiness stops a row that records the event but loses the diagnosis, which
    would leave the ledger able to prove that degradation happened and unable to say
    why — the state this defect was already in. The SUCCESS arm is the one a reviewer
    found missing: with only degraded-path assertions, an implementation that logs
    exclusively on failure passes every conjunct while writing no denominator at all,
    and the dispatch rate then reads as 0/0 or silently omits the successful invocations
    it is supposed to be divided by.'
  pending_test: true
  oracle_source: golden
  oracle_evidence: The expected row count after one and after two degrades is fixed
    by the ledger's append-once-per-invocation contract stated in this SPEC before
    the writer exists; the reason string is compared to the verdict the derivation
    itself returned, which is produced by separate code from the ledger writer.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - a temporary project root so the ledger path is isolated from the developer's own
    observability directory
  observable_output: the parsed rows of the delegation ledger file
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
