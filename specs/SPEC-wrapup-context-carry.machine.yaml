- id: AC-008
  title: the ingestion drift signal survives the change of unit
  type: mechanical
  test_ids: []
  executable_predicate: ingest(fixture_split_records).diagnostics.coverage == 1.0 and
    ingest(fixture_split_group_partly_out_of_window).diagnostics.coverage == 1.0
  golden_table: []
  rubric_id: null
  note: 'coverage is priced turns over in-window assistant lines and is the repo''s
    ingestion-drift detector (harness-economics-observability ADR-009). Collapsing divides
    the numerator by ~2.2 and leaves the denominator alone, so an unrepaired coverage
    falls to ~0.45 and stays there — permanently red, therefore permanently ignored,
    which retires the signal by making it always-on. The second fixture is the load-bearing
    one: today the denominator subtracts skipped_by_reason[outside_window] from assistant_lines,
    and if one term becomes group-counted while the other stays record-counted the two
    can no longer be subtracted. A partly-out-of-window split group is exactly where
    that unit mismatch surfaces, and it is invisible to a fixture whose groups are all
    in-window.'
  pending_test: true
  oracle_source: golden
  oracle_evidence: 1.0 is coverage's pre-existing healthy value on this repo's own corpus,
    measured under the record-counting rule before this change was designed; it is a
    prior observed constant, not a value read back from the new implementation.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - a fixture in which at least one split group straddles the reporting window boundary,
    without which the record-vs-group unit mismatch cannot bite
  observable_output: IngestionDiagnostics.coverage after a full ingestion
