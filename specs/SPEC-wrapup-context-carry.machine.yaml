  judgment_subject_hash: null
- id: AC-007
  title: health fails a configured-but-never-firing delegation
  type: mechanical
  test_ids: []
  executable_predicate: signal(readiness(briefs_but_no_dispatch), "delegation_fires").passed is False and signal(readiness(no_ledger), "delegation_fires").passed is False and signal(readiness(all_briefs_degraded), "delegation_fires").passed is False and signal(readiness(unknown_dispatch_status), "delegation_fires").passed is False and len({signal(readiness(no_ledger), "delegation_fires").action, signal(readiness(briefs_but_no_dispatch), "delegation_fires").action, signal(readiness(all_briefs_degraded), "delegation_fires").action}) == 3 and signal(readiness(dispatch_unavailable_only), "delegation_fires").passed is True and signal(readiness(dispatched_long_ago_then_stopped), "delegation_fires").passed is False and signal(readiness(delegation_off), "delegation_fires").passed is True
  golden_table: []
  rubric_id: null
  note: 'Seven fixture trees, and the signal reads a RECENCY WINDOW — the most recent 10 brief rows of EVERY status, ordered by parsed timestamp, and the same-stage dispatch rows at or after the oldest of them. Anchoring on brief-OK rows was itself the defect: the anchor then stops being written by the very regression being detected, so the floor freezes in the last healthy era and the verdict reads ok indefinitely. A brief whose timestamp will not parse is EXCLUDED from the window rather than sorted oldest — sorted oldest it becomes the floor and admits every dispatch in the file. The window is stage-scoped because the ledger is shared and `verify` briefs degrade structurally. The `dispatched_long_ago_then_stopped`
    arm is why: the ledger is append-only, so a lifetime-existence rule ("has any dispatch
    ever succeeded") goes green on the first success and stays green through every later
    regression, which is precisely the blind spot this whole SPEC exists to close, rebuilt
    one layer further in. A window also avoids row-to-row pairing, so concurrent sessions
    interleaving rows cannot confuse it. The signal is defined over DISPATCH-observed rows, not
    brief-derivation rows — one wired to derivability would go green the moment the
    cwd seam is closed while the subagent might still never be dispatched, reinstalling
    the four-month blind spot one level up. Both informational arms FAIL rather than
    pass-with-an-action, because Signal.action has exactly one consumer (improvement._extract_layer1_actions)
    and it is gated on `sig.passed` — a passing signal''s action renders nowhere, so
    "pass with an action" would ship inert while this AC certified it green. Failing
    is score-neutral here: _score_signals sums the weights of PASSED signals, and this
    one ships at weight 0. The action-inequality conjunct is load-bearing: three failing arms that emit the same string are indistinguishable to the user whose remedies differ ("run wrapup once" vs "the brief is not derivable" vs "your dispatches are not happening"), and they point at three different places. The unavailable-only
    arm keeps Cursor and Codex harnesses — where the stage self-skips the subagent
    entirely — off a permanent red they cannot clear. The unconfigured arm matches
    readiness''s existing treatment of permissions_deny_present as an intended config
    choice rather than a finding.'
  pending_test: true
  oracle_source: golden
  oracle_evidence: The three expected verdicts follow from the signal contract fixed
    in this SPEC's S7 table before the signal exists, and the N-A treatment is copied
    from the pre-existing permissions_deny_present precedent in readiness.py rather
    than invented alongside the test.
  oracle_independence_waiver: null
  input_domain: null
  transformation: null
  expected_relation: null
  preconditions:
  - seven fixture project trees — brief rows with no dispatch rows; no ledger at all; dispatch rows that are all `unavailable`; a successful dispatch row followed by more than 10 later brief rows and no further dispatch; every recent brief `degraded`; a recent dispatch carrying an unrecognised status; and delegation unconfigured
  observable_output: the passed flag and action string of the delegation signal in
    the readiness result
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
