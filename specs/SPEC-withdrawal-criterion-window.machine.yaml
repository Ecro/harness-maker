irreversible_decisions:
- id: IRR-001
  decision: The `withdrawal` block of `hm world gap --json` drops `objectives_observed`
    and `wrapups_since_fill` and gains `last_signal_at` and `quiet_wrapups`.
  category: public API/CLI contract
  rationale: '`gap --json` is a documented machine-readable output. A consumer outside
    this repository that reads the removed keys breaks, and no in-repo shim can reach
    it. Retaining the old names over new meanings was rejected: a name that makes
    a reader believe something false about behaviour is the defect, not the fix.'
  source: spec
