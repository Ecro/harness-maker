ac:
- id: AC-001
  title: An event older than the window cannot change the verdict
  type: property
  test_ids:
  - tests/unit/test_world_withdrawal.py::test_ac_001_a_signal_older_than_the_cutoff_changes_nothing
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: A rule that reads a bounded window must be blind to everything
    outside it; the relation holds for any correct windowed implementation regardless
    of how it is written, and it is exactly what the retired cumulative rule violated
    - one closed objective from 2026-09-18 pinned `due` to false for the project's
    remaining life.
  oracle_independence_waiver: null
  input_domain: a non-empty signal history (aware UTC instants), a wrapup start timeline,
    and one extra signal instant strictly earlier than the history's maximum
  transformation: append the extra signal to the history and recompute the withdrawal
    report
  expected_relation: report.last_signal_at, report.quiet_wrapups and report.due are
    all unchanged
  preconditions:
  - the signal history is non-empty
  - the extra instant is strictly earlier than max(history)
  observable_output: the withdrawal report mapping
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
- id: AC-002
  title: The due state is reachable from every non-vetoed state
  type: property
  test_ids:
  - tests/unit/test_world_withdrawal.py::test_ac_002_due_is_reachable_from_every_filled_revisit_free_state
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: Reachability of the `due` state is the defining difference from
    the retired rule, which was absorbing - once any objective carried `observed`,
    no extension of the history could make `due` true again. The relation is stated
    over all histories, so it cannot be satisfied by reading the implementation's
    branches.
  oracle_independence_waiver: null
  input_domain: any world state whose revisit_candidates_now is 0
  transformation: append WITHDRAWAL_WRAPUPS wrapup start events dated after the last
    signal, adding no new signal of any kind
  expected_relation: report.due is True
  preconditions:
  - revisit_candidates_now == 0
  - the wrapup timeline is countable (reason would be ok)
  observable_output: the withdrawal report's `due` field
  generator_hint: null
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
