- id: IRR-001
  decision: New file specs/SPEC-<slug>.golden.json holding parametric golden rows,
    read by user tests
  category: schema/file format/storage layout
  rationale: user tests will depend on its path and shape
  source: spec
- id: IRR-002
  decision: 'hm check default output collapses passing sections to {"ok": true}; --full
    restores the full line'
  category: public API/CLI contract
  rationale: scripts reading a passing section's detail must add --full
  source: spec
- id: IRR-003
  decision: New verb hm spec_machine export-golden; spec_machine check output gains
    an approval field
  category: public API/CLI contract
  rationale: rendered templates call the verb and read the field
  source: spec
