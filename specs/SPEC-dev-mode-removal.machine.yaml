schema_version: 3
spec_slug: dev-mode-removal
parent_spec: null
verification_tier: 1
mutation_threshold: 85
mutation_threshold_rationale: 'Tier-1: the migration rewrites a user configuration
  file in place and the key it reads is destroyed in the same pass, so a surviving
  mutant in the translation silently relaxes or tightens every gate a project has.
  A surviving mutant in the absent-case resolver picks the wrong preset default for
  readers that never crash but disagree; one in the fail-closed oracle exception opens
  the circular-oracle path the exception exists to hold shut; one in the malformed-value
  guard falls through to a default the malformed value was trying to override.'
last_mutation_run: null
