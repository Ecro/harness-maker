irreversible_decisions:
- id: IRR-001
  decision: harness.yaml schema 4 to 5 — dev_mode is translated into spec.strictness
    and the key is dropped at load
  category: schema/file format/storage layout
  rationale: The user's configuration file is rewritten in place on the next --update;
    once the key is gone the original choice cannot be recovered from the file, so
    the translation has to be right the first time.
  source: spec
- id: IRR-002
  decision: --dev-mode is removed from all four CLI entry points with no deprecation
    alias
  category: public API/CLI contract
  rationale: A published flag. Any external caller that passes it gets an argument
    error rather than a warning, and there is no window in which both spellings work.
  source: spec
