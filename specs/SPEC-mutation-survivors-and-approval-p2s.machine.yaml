irreversible_decisions:
- id: IRR-001
  decision: The approval stamp gains a per-field digest map alongside its content
    hash.
  category: schema/file format/storage layout
  rationale: Every consumer of the stamp — approval-status, the land hold, any later
    reader — sees the new key. Once stamps carrying it exist across repos, removing
    it strips their diagnostic and breaks any reader keyed on it.
  source: spec
- id: IRR-002
  decision: A stamp written without the digest map stays valid; its hold falls back
    to the pre-change wording.
  category: data migration
  rationale: This decides whether existing approvals survive the upgrade. Reversing
    it later forces every project holding an approved SPEC to re-stamp before it can
    land.
  source: spec
- id: IRR-003
  decision: 'The lock key rule: one lock file per guarded file, under a gitignored
    directory.'
  category: public API/CLI contract
  rationale: Mutual exclusion holds only while every writer derives the same key.
    A later writer that derives a different path gets no exclusion and no error —
    the failure is silent by construction.
  source: spec
