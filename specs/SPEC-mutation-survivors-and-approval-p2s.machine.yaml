  title: every hashed field has its own digest, and only those
  type: property
  test_ids: []
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: true
  oracle_source: property
  oracle_evidence: Metamorphic pair against the SHIPPED hash - for each field, mutating
    it must move both the content hash and that field's digest; for each deny-listed
    field, neither. The relation is stated over the hash's observed behaviour, not
    over the digest implementation, so a digest built from a second payload builder
    fails it.
  oracle_independence_waiver: null
  input_domain: machine SPECs built from the repo's own specs/ plus generated variants
    with unknown extra keys at both the top level and inside an acceptance criterion
  transformation: mutate exactly one field, then recompute the content hash and the
    digest map
  expected_relation: 'for a hashed field f: hash changes AND digests[f] changes AND
    every other digest is unchanged; for a deny-listed field: hash unchanged AND digest
    map unchanged; and set(digests) equals the set of fields the hash covers'
  preconditions:
  - the SPEC loads and validates before the mutation
  observable_output: the content hash string and the digest mapping
