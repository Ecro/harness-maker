mutation_threshold_rationale: 'Tier-1: the digest map is what a hold message names
  a field from, so a surviving mutant there makes the gate accuse the wrong field
  — worse than the silence it replaces. The module is small and its runner is scoped,
  so the gate finishes inside its 600s cap instead of reporting truncated.'
