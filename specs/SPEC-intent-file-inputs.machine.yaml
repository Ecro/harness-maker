irreversible_decisions:
- id: IRR-001
  decision: 'Add --text-file, --claim-file, --evidence-file, --note-file, --title-file,
    --statement-file, --scope-file, --out-of-scope-file and --declined-file to the
    public hm intent CLI, with fixed value semantics: UTF-8; single values = content
    minus trailing newlines, empty refused; multi-item = one item per non-empty stripped
    line, zero items refused'
  category: public API/CLI contract
  rationale: Rendered harnesses will write files to these semantics; removing a flag
    or changing the semantics later breaks them.
  source: spec
