- id: AC-001
  title: File value equals inline value
  type: property
  test_ids:
  - tests/unit/test_intent_file_inputs.py::test_file_equals_inline
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'The oracle is the generated original x itself: each stored field
    is compared to x, not to the other path, so a shared normaliser that alters both
    paths still fails; timestamps are excluded and each call uses a fresh root.'
  oracle_independence_waiver: null
  input_domain: non-empty Unicode text not ending in a newline, including quotes,
    backticks, $ and embedded newlines
  transformation: write x plus 0-2 trailing newlines to a file and pass --<name>-file;
    separately pass --<name> x inline; each on a fresh root
  expected_relation: stored field via file == x and stored field via inline == x (timestamp
    fields excluded)
  preconditions:
  - text is non-empty after removing trailing newlines
  observable_output: intent record fields read back from disk
  generator_hint: hypothesis text() filtered to non-empty, not ending in newline
  judgment_verdict: null
  judged_at: null
