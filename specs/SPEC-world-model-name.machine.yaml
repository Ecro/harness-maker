  judged_at: '2026-10-02'
  judgment_evidence: 'All five skill-rubric criteria pass. trigger_conditions_explicit:
    SKILL.md.j2:9 states when to invoke (name or handle) and when not to (bare verbs).
    progressive_disclosure: this is a standalone skill file with name/description
    frontmatter (lines 7-10). implementation_referenced: the briefing bash block (lines
    41-46, 52) holds the concrete commands, and the route table (lines 28-32) names
    the surfaces. input_output_specified: input is $ARGUMENTS (line 22) and output
    is at most 8 lines opening with the display name (lines 17, 61). under_fifty_lines_side:
    the file is 74 lines, under the 300 cap. The AC''s request classes are also covered.
    (a) Empty maps to read-only Briefing (line 27; lines 36 and 61 say it writes nothing).
    (b) Build/fix X maps to research or spec, with ''State the choice and why in one
    line'' (line 28). (c) Continue maps to Resume (lines 29, 65-74): one task re-enters
    its stage, and two or more get ''ONE closed question''. (d) Remember X maps to
    the project-knowledge skill (line 30). (e) Goal/metric/assumption maps to the
    intent-layer skill, ''its consent rule applies unchanged'' (line 31). (f) What
    next maps to Briefing plus 2-4 options, and ''Start no stage'' (line 32). Every
    reply opens with ''{name} —'' in the harness voice (line 17).'
