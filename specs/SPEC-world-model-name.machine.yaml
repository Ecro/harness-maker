irreversible_decisions:
- id: IRR-001
  decision: Add world_model {name, handle} to harness.yaml
  category: schema/file format/storage layout
  rationale: HarnessConfig is extra=forbid, so older plugin CLIs reject a yaml carrying
    the key; once in users' files the shape is hard to change
  source: spec
- id: IRR-002
  decision: /<handle> and $<handle> invocation plus --ci world_model_name= and world_model_handle=
    flags
  category: public API/CLI contract
  rationale: Operators and scripts depend on the handle and the flag names
  source: spec
- id: IRR-003
  decision: The router skill render path skills/<handle>/ is chosen by user input
  category: schema/file format/storage layout
  rationale: First user-determined render path; rename correctness depends on the
    orphan sweep
  source: spec
