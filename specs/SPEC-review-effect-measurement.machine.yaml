        | F2 | `P3` | b.py:2 | y | n/a | rejected | — |

        '
    expected:
      status: parsed
      counts:
        P1:
          accepted: 1
        P3:
          rejected: 1
      severe_accepted: 1
      unrecognized_n: 0
    edge: false
    note: ''
