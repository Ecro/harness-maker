        | id | severity | file:line | finding | disposition | authority |

        |---|---|---|---|---|---|

        | F1 | P1 | a.py:3 | x | accepted | |

        | F2 | P2 | b.py:9 | y | rejected | SPEC AC-002 |

        | F3 | P2 | b.py:9 | y | duplicate | |

