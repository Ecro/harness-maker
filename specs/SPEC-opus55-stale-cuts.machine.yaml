irreversible_decisions:
- id: IRR-001
  decision: The worktree-isolator skill, memory/session/README.md and the flush_session
    hook wiring stop shipping; a re-render deletes pristine copies of the skill and
    removes the shipped hook entries (an existing session README is left in place);
    python -m harness_maker.hooks.flush_session becomes an exit-0 stub.
  category: public API/CLI contract
  rationale: A user who typed the skill name or relied on the session checkpoint loses
    it on upgrade. The skill describes a retired procedure, and the checkpoint carried
    no state since autoloop was retired.
  source: spec
