- id: IRR-002
  decision: /hm:review, /hm:verify, /hm:configure and /hm:loop (and Codex $hm-review, $hm-verify,
    $hm-loop) are no longer rendered
  category: public API/CLI contract
  rationale: Scripts and habits that call them break; kept user-edited copies call CLI a later
