- id: AC-005
  title: hm check exits per its contract and never writes the tree
  type: parametric
  test_ids:
  - tests/unit/test_overhaul_p1_hm_check.py::test_ac005_exit_table
  - tests/unit/test_overhaul_p1_hm_check.py::test_ac005_red_mode_table
  - tests/unit/test_overhaul_p1_hm_check.py::test_ac005_tree_bytes_unchanged
  - tests/unit/test_overhaul_p1_hm_check.py::test_ac005_gate_env_has_no_bytecode
  executable_predicate: null
  golden_table:
  - input:
      case: approved SPEC, all gates pass, every non-judgment AC bound and passing,
        no security or cve finding in touched paths
    expected: exit 0, one JSON line, every section ok, tree_changed []
    edge: false
    note: tree_changed is always present
  - input:
      case: as row 1, a failing gate
    expected: exit 1, sections.gates.ok false
    edge: false
    note: ''
  - input:
      case: as row 1, one AC with pending_test true or empty test_ids
    expected: exit 1, sections.ac names the AC
    edge: false
    note: DRI rule 3
  - input:
      case: as row 1, a judgment AC with no current pass verdict
    expected: exit 1, sections.ac names it
    edge: true
    note: judgment is the only test-free type
  - input:
      case: as row 1, ac is [] and the stamp is not exempt
    expected: exit 1
    edge: true
    note: ''
  - input:
      case: skip-path SPEC (exempt stamp, ac []), change set touches only README.md
        and a .toml
    expected: exit 0, sections.ac ok with reason skip-path
    edge: true
    note: the exempt stamp exempts the human, not the test
  - input:
      case: skip-path SPEC (exempt stamp, ac []), change set touches a .py file
    expected: exit 1, sections.ac reason 'skip-path SPEC with a code change'
    edge: true
    note: eval-3 t6-hm-2 shape (a bugfix with ac [])
  - input:
      case: skip-path SPEC (exempt stamp, ac []), change set touches only tests/test_x.txt
    expected: exit 1
    edge: true
    note: a path under tests/ counts as a test file
  - input:
      case: as row 1, the only mapped test of an AC is skipped
    expected: exit 1, sections.ac names the AC with outcome skipped
    edge: true
    note: an env-gated skip gets no exemption
  - input:
      case: as row 1, the only mapped test of an AC is xfailed
    expected: exit 1, outcome xfailed
    edge: true
    note: ''
  - input:
      case: as row 1, the only mapped test of an AC is deselected (collected, not
        run)
    expected: exit 1, outcome deselected
    edge: true
    note: ''
  - input:
      case: as row 1, a mapped test xpasses (non-strict xfail marker)
    expected: exit 1, outcome xpassed counted as failing
    edge: true
    note: ''
  - input:
      case: hm check --no-tdd
    expected: exit 2
    edge: true
    note: --no-tdd is retired; /hm:execute prints a notice and runs TDD (AC-004 row)
  - input:
      case: as row 1, a secret-shaped string added in a touched file
    expected: exit 1, sections.security
    edge: false
    note: ''
  - input:
      case: as row 1, a secret-shaped string in an untouched harness file
    expected: exit 0, sections.security.out_of_scope >= 1
    edge: true
    note: eval-3 high=3 shape
  - input:
      case: as row 1, a curl|sh hook added to .claude/settings.json
    expected: exit 1, sections.security
    edge: false
    note: ''
  - input:
      case: as row 1, uv.lock adds a dependency with a mocked OSV hit
    expected: exit 1, sections.cve
    edge: false
    note: ''
  - input:
      case: as row 1, mocked OSV hit on an untouched dependency
    expected: exit 0, sections.cve.existing non-empty
    edge: true
    note: ''
  - input:
      case: as row 1, OSV lookup raises
    expected: exit 0, sections.cve unavailable with a warning
    edge: true
    note: never read as clean
  - input:
      case: no CI file, no .venv/bin/python
    expected: exit 3
    edge: false
    note: degraded
  - input:
      case: a gate writes a tracked file during the run
    expected: exit 4, tree_changed lists that path
    edge: true
    note: hm check itself writes nothing; the prompt reruns once and stops on a second
      exit 4
  - input:
      case: as row 1, SPEC unstamped, autonomy.level ask
    expected: exit 5
    edge: false
    note: ''
  - input:
      case: as row 1, SPEC unstamped, autonomy.level auto_full
    expected: exit 0, sections.approval pending reported
    edge: true
    note: ''
  - input:
      case: as row 1, stamp invalid (edited after approval), auto_full
    expected: exit 5
    edge: true
    note: eval-3 t12-hm-2 shape
  - input:
      case: failing gate and missing approval together
    expected: exit 1
    edge: true
    note: precedence 2 > 1 > 4 > 3 > 5 > 0
  - input:
      case: unknown flag
    expected: exit 2
    edge: false
    note: ''
  - input:
      case: --red, every testable AC has a failing test, code absent
    expected: exit 0
    edge: false
    note: ''
  - input:
      case: --red, an AC whose tests all pass
    expected: exit 1, listed in green_before
    edge: false
    note: ''
  - input:
      case: --red, same with --green-ok AC-NNN
    expected: exit 0, waiver echoed
    edge: true
    note: ''
  - input:
      case: --red, a test file with a SyntaxError, or a test id that does not exist
    expected: exit 1
    edge: true
    note: not a real RED
  - input:
      case: --red, an AC's only test is skipped, xfailed, deselected or xpassed (one
        row each in the test)
    expected: exit 1, the AC not RED, outcome named
    edge: true
    note: none of these counts as RED
  - input:
      case: --red, a test fails on ModuleNotFoundError for pkg.newmod, first-party
        and absent at HEAD
    expected: exit 0, red_by_import lists {ac, test_id, module pkg.newmod}
    edge: true
    note: new in this SPEC; db19f023 Phase B counted import errors as a wrong reason
  - input:
      case: --red, a test fails on ImportError of symbol new_fn from an existing first-party
        module, new_fn absent at HEAD
    expected: exit 0, red_by_import lists {module, symbol new_fn}
    edge: true
    note: ''
  - input:
      case: --red, a test fails on ImportError of a third-party package
    expected: exit 1, not RED
    edge: true
    note: needs an AssertionError stub instead
  - input:
      case: --red, a test fails on ImportError of a first-party name already present
        at HEAD
    expected: exit 1, not RED
    edge: true
    note: ''
  - input:
      case: plain hm check (GREEN), red_by_import name new_fn defined nowhere in the
        change set
    expected: exit 1, sections.ac reason 'red_by_import not implemented'
    edge: true
    note: derived statically with ast; no state file
  - input:
      case: plain hm check (GREEN), new_fn defined as a top-level def in a changed
        file
    expected: sections.ac ok for that AC
    edge: false
    note: ''
  - input:
      case: --mutation with mutmut absent
    expected: skip notice, section passes
    edge: true
    note: unchanged from db19f023 spec_mutation gate
  rubric_id: null
  note: PR-S
  pending_test: true
  oracle_source: golden
  oracle_evidence: The exit meanings, the pytest-outcome rule, the skip-path rule
