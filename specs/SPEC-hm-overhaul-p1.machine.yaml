irreversible_decisions:
- id: IRR-001
  decision: Drop the Cursor target (targets cursor ignored with a warning, no .cursor/
    render, .cursor-plugin/plugin.json deleted, version sync 4 files, Cursor-only
    Python deleted)
  category: public API/CLI contract
  rationale: Users and the Cursor Marketplace lose a supported target; restoring it
    means restoring code and the listing. Pruned-cache risk, a kept user-edited .cursor/hooks.json
    runs uv run --with a plugin cache path, and once that cache is pruned every command
    fails before any module loads; AC-008 cannot cover it and Cursor's handling is
    unverified; the KEPT warning says so on every update while the file exists.
  source: spec
- id: IRR-002
  decision: /hm:review, /hm:verify, /hm:configure and /hm:loop (and Codex $hm-review,
    $hm-verify, $hm-loop) are no longer rendered; /hm:execute --no-tdd becomes a notice
    and TDD runs anyway
  category: public API/CLI contract
  rationale: Scripts and habits that call them break; kept user-edited copies call
    CLI a later phase may delete.
  source: spec
- id: IRR-003
  decision: New `hm check` CLI with its flags, JSON line and exit codes 0/1/2/3/4/5
    and their precedence
  category: public API/CLI contract
  rationale: Stage prompts and users script against it.
  source: spec
- id: IRR-004
  decision: hm check security scope is touched paths only, never counts self-imports,
    gates on secrets and hook-injection only, and checks CVEs by default, gating only
    on added or re-pinned dependencies
  category: security/permission boundary
  rationale: It decides what can ship; a finding in an untouched file or dependency
    is reported but never blocks.
  source: spec
- id: IRR-005
  decision: Retire the telemetry, post_write_reminder and autopilot_autoarm hooks
    through the append-only retired set, stub their entry points, and end autopilot
    auto-advance
  category: public API/CLI contract
  rationale: The retired set is append-only by test and re-rendering strips these
    hooks from every user's settings.
  source: spec
- id: IRR-006
  decision: harness.yaml keeps every key; keys whose consumer is retired (loop.enabled,
    delegation.stages naming review or verify, retired skills, agent_models of retired
    agents, autonomy.autopilot_persistent, and lens reviewers while reviewers.fanout
    is false) stay parseable, keep their value and become inert with one warning each
    per make run; the only rewrite is dropping cursor from targets; no lane field
    remains. reviewers.fanout is a new additive key (default false); a file without
    it parses and behaves as with false, so it adds no irreversible decision
  category: schema/file format/storage layout
  rationale: A user's config silently changes meaning; ignoring keeps every 0.62 file
    loadable under extra=forbid where a rewrite would discard values the user chose;
    restoring behaviour means restoring the consumers, not the file.
  source: spec
