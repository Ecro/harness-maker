irreversible_decisions:
- id: IRR-001
  decision: hm check --red resolves an AC with empty test_ids by the name convention,
    and mark-tested --ac records the discovered ids instead of refusing
  category: public API/CLI contract
  rationale: Phase A stops editing the yaml by hand; a script that relied on "no test_ids"
    for an AC with a convention-named test now sees that test bound
  source: spec
- id: IRR-002
  decision: the name convention gains parametrize ids — a case id AC-NNN or AC-NNN-<suffix>
    binds to AC-NNN
  category: public API/CLI contract
  rationale: one parametrized test can carry several ACs; existing test_ac_NNN names
    keep working
  source: spec
