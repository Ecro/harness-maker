irreversible_decisions:
- id: IRR-001
  decision: hm intent question resolve accepts only open->confirmed/wrong and wrong->confirmed/open;
    all other pairs are refused
  category: public API/CLI contract
  rationale: invocations that succeed today (e.g. confirmed->wrong) start failing
  source: spec
- id: IRR-002
  decision: a trial is inactive only when its latest user policy decision has enabled
    false in both working copy and HEAD; every other case stays active and protected
  category: schema/file format/storage layout
  rationale: changes the meaning of a stored field that the land path reads
  source: spec
- id: IRR-003
  decision: workflow-feedback consent moves from per-write at any stage to one batched
    record question plus one close question at wrapup 5.7
  category: security/permission boundary
  rationale: the unit of human approval for intent writes changes in every rendered
    harness
  source: spec
- id: IRR-004
  decision: '- on any --*-file flag reads stdin; --observed-at becomes optional (default
    now)'
  category: public API/CLI contract
  rationale: once consumers rely on the additive inputs, removing them breaks callers
  source: spec
