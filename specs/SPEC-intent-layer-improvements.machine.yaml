  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: Expected values are written in the SPEC independent of the normaliser
    (scalar x.rstrip newline; list = non-empty stripped lines), so a shared normaliser
    bug that alters both file and stdin paths still fails.
  oracle_independence_waiver: null
  input_domain: non-empty Unicode text including quotes, backticks, $ and embedded/trailing
    newlines, split into scalar flags and list flags (--scope-file, --out-of-scope-file,
    --declined-file)
  transformation: pass x via --<name>-file - with stdin on a fresh root
  expected_relation: scalar stored == x.rstrip("\n"); list stored == [l.strip() for
