irreversible_decisions:
- id: IRR-001
  decision: Without a question tool, the DRI's own reply choosing Approve in a numbered
    list counts as SPEC approval, and /hm:spec Step 5's --exempt branch opens only
    at auto_full (no longer on "no question tool")
  category: security/permission boundary
  rationale: Changes what counts as the human lock-in on a SPEC; cheap to revert in
    text, but an approval-boundary change, so the DRI decides it.
  source: spec
