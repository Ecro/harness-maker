- id: AC-001
  title: Every stage command and Maker carries the Choices rule for its runtime
  type: mechanical
  test_ids:
  - tests/render/test_choice_cards.py::test_ac_001_commands_carry_the_choice_rule
  executable_predicate: all(text.count(choice_rule(runtime)) == 1 for preset in ('Side',
    'Production') for runtime, text in stage_and_maker_renders(preset))
  golden_table: []
  rubric_id: null
  note: 'Rule text (amended 2026-10-17): "**Choices.** Ask each choice with <TOOL>;
    recommendation first, except approvals and equal options. Without the tool: a
    numbered list, then wait; never choose for the user." Stage renders are .claude/commands/hm/{research,spec,execute,wrapup}.md
    and .agents/skills/hm-{research,spec,execute,wrapup}/SKILL.md; Maker is .claude/skills/maker/SKILL.md
    and .agents/skills/maker/SKILL.md.'
  pending_test: false
  oracle_source: golden
  oracle_evidence: The rule text is written into SPEC AC-001 from the DRI's 2026-10-17
    request (every choice as a card), the tool names the two hosts expose (stages/_hm.md.j2
    ask() macro) and spec-validator round 1 (no recommendation on approvals or equal
    options), before any template changed.
