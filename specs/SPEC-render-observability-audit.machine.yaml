- id: AC-003
  title: A closed span's end row carries its start's task and branch
  type: property
  test_ids:
  - tests/unit/test_stage_span_end_fields.py::test_span_end_preserves_start_task_and_branch
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: ''
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Round-trip invariance, not a fixture: whatever slug and branch
    the start carried, the end must carry. The relation holds for every (slug, branch)
    pair regardless of how span-end resolves them internally, so an implementation
    cannot satisfy it by echoing a hardcoded value the test also knows. Observed violation:
    all 109 end rows in the live ledger null both fields while their starts carry
    them.'
  oracle_independence_waiver: null
  input_domain: any (task_slug, git_branch) pair emitted by task-preflight, including
    non-ASCII and hyphenated slugs
  transformation: emit a start event for (slug, branch), then close it via `worktree
    span-end`
  expected_relation: end.task_slug == start.task_slug and end.git_branch == start.git_branch
  preconditions:
  - the span is the caller's own (session_id matches, or both are session-less)
  - no intervening start from the same session
  observable_output: the appended SpanEvent row in stage-spans.jsonl
  generator_hint: vary slug charset and branch prefix; include the session-less degraded
    path
  judgment_verdict: null
  judged_at: null
  judgment_evidence: null
  judgment_subject_paths: []
  judgment_subject_hash: null
- id: AC-004
  title: The delegate stops producing deterministically-invalid receipts
  type: parametric
  test_ids:
  - tests/unit/test_wrapup_receipt_deterministic_kinds.py::test_deterministic_receipt_mismatch_kinds_absent
  executable_predicate: null
  golden_table:
  - input:
      kind: receipt-unparseable
      receipt: a receipt whose steps_skipped and drift_verdict use the shapes the
        delegate actually emits
    expected: []
    edge: false
    note: 'Observed 2026-08 run hm-receipt.vvv0sGJy: pydantic extra_forbidden on steps_skipped
      (list) and drift_verdict (dict).'
  - input:
      kind: document-escapes-root
      receipt: a receipt listing documents the delegate wrote from inside .worktrees/<slug>/
    expected: []
    edge: false
    note: 'Observed 7 occurrences in one run: absolute worktree paths rejected as
      escaping the repository root.'
  - input:
      kind: promotion-arithmetic
      receipt: a receipt whose candidates equal promoted + skipped
    expected: []
    edge: false
    note: 'Observed twice: ''4 candidates but 3 promoted + 0 skipped = 3'' and ''6
      candidates but 4 promoted + 0 skipped = 4''.'
  - input:
      kind: wiki-missing
      receipt: a receipt claiming a wiki.md heading that was never written
    expected:
    - wiki-missing
    edge: false
    note: Claim-based kind — must REMAIN reportable and distinct. Guards against fixing
      the rate by silencing the check.
  - input:
      kind: failure-missing
      receipt: a receipt claiming a failures.md heading that was never written
    expected:
    - failure-missing
    edge: false
    note: Claim-based kind — must remain distinct from wiki-missing.
  - input:
      kind: promotion-missing
      receipt: a receipt claiming a Second Brain promotion absent from the vault
    expected:
    - promotion-missing
    edge: false
    note: Claim-based kind — must remain distinct.
