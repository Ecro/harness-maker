    nested dirs>, for generated names and k in 0..3
  transformation: resolve the default memory dir from that cwd with no --memory-dir
    given
  expected_relation: default_memory_dir(cwd) == memory_md._memory_dir(cwd) for every
    generated cwd
  preconditions:
