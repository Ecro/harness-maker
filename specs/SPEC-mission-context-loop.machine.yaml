  title: same-slug upsert replaces in place and keeps the Supersedes line
  type: property
  test_ids:
  - tests/unit/test_memory_md_fact_supersede.py::test_ac_003_same_slug_upsert_replaces_and_keeps_supersedes
  executable_predicate: null
  golden_table: []
  rubric_id: null
  note: Regression guard on existing upsert-wiki semantics the capture contract relies
    on.
  pending_test: false
  oracle_source: property
  oracle_evidence: Replace-by-key is an invariant of any upsert regardless of implementation;
    the expected body is the test's own second input, so heading count 1 and body
    equality are decided without reading memory_md.
  oracle_independence_waiver: null
  input_domain: slug from [a-z0-9-]{3,30}, two distinct non-marker bodies, the second
    ending in a 'Supersedes:' line
  transformation: upsert-wiki(slug, body1) then upsert-wiki(slug, body2) on a fresh
    tier
  expected_relation: wiki.count(f'] {slug} |') == 1 and body_of(slug) == body2.strip('\n')
  preconditions:
  - bodies contain no memory marker strings and no '## [x:y]' heading-shaped lines
  observable_output: .claude/memory/wiki.md text
  generator_hint: Hypothesis st.text over printable non-marker characters; ci profile
