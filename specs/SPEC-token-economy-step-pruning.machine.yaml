- id: AC-010
  title: unattributed spend is decomposed, not opaque
  type: mechanical
  test_ids:
  - tests/unit/test_economics_unattributed_breakdown.py::test_unattributed_decomposes_and_sums
  executable_predicate: set(report["unattributed_breakdown"]) >= {"recoverable", "unrecoverable_in_window"}
    and all(v["turns"] > 0 for v in report["unattributed_breakdown"].values()) and
    sum(v["turns"] for v in report["unattributed_breakdown"].values()) == report["by_stage"]["(unattributed)"]["turns"]
    and abs(sum(v["usd"] for v in report["unattributed_breakdown"].values()) - report["by_stage"]["(unattributed)"]["total_usd"])
    < 1e-9 and report["unattributed_breakdown"]["recoverable"]["turns"] > report["turns_by_attribution_source"]["adjacency"]
  golden_table: []
  rubric_id: null
  note: 'Conservation is the load-bearing half — a breakdown whose parts do not sum
    to the whole would hide turns rather than explain them. POSITIVE ARM (validator-3
    C4): the four conservation/presence conjuncts are jointly INVARIANT over the entire
    novel half of ADR-013. `economics.py:502-507` sets `source = "adjacency"` iff
    an estimate resolved and `"none"` otherwise, and both land in `by_stage["(unattributed)"]`,
    so `recoverable = {turns where est is not None}` — i.e. ignoring `preceded_by_user`
    altogether — yields both keys, both non-zero (430 adjacency / 5,812 none in the
    live window), and exact conservation by construction. That is the named broken
    implementation, and it passed every conjunct while implementing none of the ADR.
    The final arm rejects it: `recoverable` is the UNION of adjacency-resolvable and
    `preceded_by_user`, so its turn count must strictly exceed the already-shipped
    `turns_by_attribution_source["adjacency"]` count. This is the same shape the second-pass
    validator caught in AC-002; the fix is the same paired-arm remedy. USD conservation
    is compared with a 1e-9 tolerance, not `==` — the two sides are differently-ordered
    float accumulations and exact equality is flaky by construction (validator-3 M4).'
  pending_test: true
  oracle_source: property
  oracle_evidence: 'Conservation invariant: a partition of the unattributed bucket
    must sum to that bucket regardless of how many categories exist or how each turn
    is classified. It is independent of the classifier''s rules, so a wrong classification
    cannot satisfy it, and it holds for any future category the implementation adds.
    The buckets are defined in PLAN ADR-013 over fields that exist on TurnRecord (adjacency
    resolvability within the configured window, and preceded_by_user), and the decomposed
    population is the by_stage "(unattributed)" bucket (sources adjacency + none),
    not every turn with attribution_skill None. The three categories named in PLAN-economics-attribution-and-carry
    were re-framed by ADR-013 as population absences rather than per-turn buckets.'
  oracle_independence_waiver: null
  input_domain: any economics report window containing at least one unattributed turn
  transformation: decompose the unattributed bucket into its categories
  expected_relation: sum(parts) == unattributed_total, for every window and every
    category set
  preconditions:
  - the window contains at least one unattributed turn
  - the fixture contains at least one unattributed turn with NO adjacency-resolvable
    neighbour but preceded_by_user true, without which the positive arm cannot bite
  observable_output: the unattributed_breakdown mapping, the by_stage unattributed
    turn count, and turns_by_attribution_source["adjacency"]
  generator_hint: null
  judgment_verdict: null
