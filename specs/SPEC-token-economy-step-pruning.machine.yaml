- id: AC-008
  title: reviewer reads are bounded, elision is visible, escalation is always available
  type: mechanical
  test_ids:
  - tests/render/test_render_review_read_budget.py::test_bounded_read_with_escalation
  executable_predicate: all(len(reviewer_dispatch_sites(render)) >= 1 for render in
    reviewer_renders()) and len(reviewer_dispatch_sites(single_reviewer_review_render()))
    >= 1 and all(has_bounded_read_default(site) and has_escalation_clause(site) and
    requires_visible_elision_marker(site) and states_outside_diff_scope(site) and
    not contains_unconditional_full_file_read(site) for render in reviewer_renders()
    for site in reviewer_dispatch_sites(render))
  golden_table: []
  rubric_id: null
  note: 'Known limitation, stated deliberately: this is a render-grep and therefore
    proves only that the instruction is PRESENT, never that a reviewer obeys it (CLAUDE.md
    checkpoint 2). Behavioural confirmation is Open Question 5 and is out of scope.
    NON-VACUITY + COVERAGE (validator-3 C3, ADR-011 amended). Two defects are closed
    here. (a) `all()` over an empty set is True, so a discovery function returning
    nothing satisfied every arm; the leading non-emptiness conjuncts reject that.
    (b) `reviewer_renders()` was (atomic, fused), both produced from THIS harness''s
    multi-reviewer config, which structurally cannot emit the `{% else %}` branch
    at review.md.j2:217 holding the fourth site `#### Direct review (single reviewer
    — Pass 2 only)` (:223). It is now (atomic, fused, single-reviewer), the third
    rendered with `reviewers.enabled` of length <= 1, and is named separately in the
    second conjunct so an empty discovery on that render alone cannot hide. DISCOVERY
    DEFINITION (was a named-but-undefined function): `reviewer_dispatch_sites(render)`
    = every `####` heading block inside the reviewer-dispatch step whose body names
    a reviewer agent to run. On the pre-change template that yields exactly 4 sites
    — Pass 1 (:175), Pass 1.5 (:194), Pass 2 (:216), Direct review (:223) — of which
    the first three are reachable only under multi-reviewer config and the fourth
    only under single-reviewer. The anchor is a heading shape that exists BEFORE the
    edit, so the count cannot be tuned by the change under test. Pass 1.5 dispatches
    `code-verifier`, which today reads nothing of its own; the clause is required
    there anyway rather than exempted, because an exemption is what made the earlier
    enumeration vacuous and because the site gains a read the moment the verifier
    does.'
  pending_test: true
  oracle_source: golden
  oracle_evidence: 'The expected instruction shape (a bounded default plus an explicit
    escalation clause) is specified by AC-008 in this SPEC and by the Constraints
    table, both authored before the template edit. The negative arm pins the pre-change
    string "Reads the diff with full context (use Read on changed files end-to-end,
    not just the patch)." observed at review.md.j2:187-188, so the assertion is anchored
    to an observed prior state rather than to the new template. The pin is matched
    WHITESPACE-NORMALIZED: in the template the sentence is line-wrapped between "changed
    files" and "end-to-end", and its verb is "Reads", not "Read". An earlier draft
    pinned an unwrapped "Read the diff ..." that appears nowhere in the source, so
    the negative arm could never match and therefore always passed (validator-3 M6).'
  oracle_independence_waiver: null
