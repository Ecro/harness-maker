- id: AC-001
  title: cache minimums resolve per model, preserving non-monotonicity
  type: parametric
  test_ids:
  - tests/unit/test_cache_minimums_per_model.py::test_min_cacheable_is_per_model_and_non_monotonic
  - tests/unit/test_cache_minimums_per_model.py::test_mixed_model_window_resolves_two_thresholds
  executable_predicate: null
  golden_table:
  - input:
      turn_model: claude-opus-5
    expected: 512
    edge: true
    note: lowest published minimum; a family-prefix matcher cannot reach it
  - input:
      turn_model: claude-opus-4-8
    expected: 1024
    edge: false
    note: ''
  - input:
      turn_model: claude-sonnet-5
    expected: 1024
    edge: false
    note: ''
  - input:
      turn_model: claude-opus-4-7
    expected: 2048
    edge: false
    note: ''
  - input:
      turn_model: claude-opus-4-6
    expected: 4096
    edge: true
    note: same family as opus-5 but 8x the minimum — the non-monotonicity discriminator
  - input:
      turn_model: claude-haiku-4-5
    expected: 4096
    edge: false
    note: ''
  rubric_id: null
  note: 'The opus row ordering 512 / 1024 / 2048 / 4096 across 5 / 4.8 / 4.7 / 4.6
    is the discriminating case: any family-prefix matcher collapses it to one value
    and fails. PRODUCTION-PATH BINDING (ADR-010 + ADR-012, validator-3 H1): each row
    is driven through `diagnose_cache_from_turns` on single-turn windows whose TurnRecord.model
    is `turn_model`, and the applied minimum is observed as a BOUNDARY on the `miss_min_threshold`
    counter (a prefix of `expected - 1` must produce the verdict and a prefix of `expected`
    must not) — NOT read from `_threshold_for_model` directly. A resolver-only test
    passes while `_entry_from_turn` drops `model`, the defect ADR-012 exists to close.
    The second test id is the discriminator: a window mixing an Opus-5 turn and an
    Opus-4-6 turn must yield TWO different thresholds, which is impossible for any
    implementation resolving one threshold per window.'
  pending_test: false
  oracle_source: golden
  oracle_evidence: 'Values are transcribed from the published per-model minimum table
    in the Anthropic prompt-caching documentation (shared/prompt-caching.md, "Minimum
    cacheable prefix is model-dependent"), which is external to and predates this
    implementation. No value is derived from the resolver under test. The shipped
    `_MIN_CACHEABLE_PREFIX` carries one key beyond these six rows — `sonnet-4-6: 1024`,
    from the same published table (Sonnet minimum 1024) — because `claude-sonnet-4-6`
    is the hard-coded default in all three `ai_readiness.py` callers and an absent
    key would degrade /hm:health''s default window to `miss_unknown_model`. It has
    no golden row and no direct assertion: both AC-004 fixtures use a 6,000-token
    prefix, so a mistyped value would ship green. That is an accepted residual — inventing
    a seventh row without a distinct published citation would be the circular oracle
    this SPEC forbids elsewhere.'
  oracle_independence_waiver: null
