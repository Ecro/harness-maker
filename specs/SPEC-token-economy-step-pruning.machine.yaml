- id: AC-002
  title: an unknown model never produces a guessed threshold verdict
  type: mechanical
  test_ids:
  - tests/unit/test_cache_minimums_per_model.py::test_unknown_model_never_min_threshold
  executable_predicate: diagnose_cache_from_turns(turns_with_model("claude-not-a-real-model-9",
    prefix_tokens=100)).counters["miss_min_threshold"] == 0 and diagnose_cache_from_turns(turns_with_model("claude-opus-4-6",
    prefix_tokens=2000)).counters["miss_min_threshold"] >= 1 and diagnose_cache_from_turns(turns_with_model("claude-opus-5",
    prefix_tokens=700)).counters["miss_min_threshold"] == 0
  golden_table: []
  rubric_id: null
  note: 'Guards the absent-case black hole named in CLAUDE.md — an unmatched model
    must be reportable, not silently defaulted. Every prefix length is pinned so that
    each arm rejects a NAMED broken implementation (validator-3 H1; the unpinned draft
    was invariant over the defect it targeted). Arm 1 (unknown, 100): a fallback to
    1024 makes 100 sub-threshold and emits the verdict — only a `None` threshold passes.
    Arm 2 (opus-4-6, 2000): correct per-model 4096 emits the verdict; a 1024 fallback
    does not, so the arm dies if the entry bridge drops `model`. Arm 3 (opus-5, 700):
    correct per-model 512 emits nothing; a 1024 fallback emits the verdict. Arms 2
    and 3 are opposite-signed on the same defect, so no single fallback value satisfies
    both.'
  pending_test: false
  oracle_source: property
  oracle_evidence: 'Metamorphic invariant, independent of any threshold value: for
    every model identifier absent from the known-minimums table, no prefix length
    may yield a min-threshold verdict, because the verdict is undefined without a
    known minimum. Holds regardless of what the table contains, so it cannot be satisfied
    by reading the implementation''s constants.'
  oracle_independence_waiver: null
  input_domain: model identifiers not present in the known-minimums table, paired
    with any non-negative prefix token count
  transformation: classify the turn's cache failure mode
  expected_relation: failure_mode != "miss_min_threshold" for all such inputs
  preconditions:
  - the model identifier is absent from the known-minimums table
  observable_output: the classifier's failure_mode label
  generator_hint: null
