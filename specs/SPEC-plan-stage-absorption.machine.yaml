irreversible_decisions:
- id: IRR-001
  decision: the `/hm:plan` slash command is removed from all three targets with no
    stub
  category: public API/CLI contract
  rationale: a user-facing surface of a published plugin; restoring it costs a release
    and a second announcement
  source: spec
- id: IRR-002
  decision: '`AtomicStage.PLAN` is removed from the enum and `plan` is dropped once
    from `autonomy.pipeline` at load'
  category: data migration
  rationale: the migration rewrites user configuration in place; the original pipeline
    value is not recoverable afterwards
  source: spec
- id: IRR-003
  decision: the producer of `spec_need_verdict` / `spec_need_target` moves from `/hm:plan`
    to `/hm:execute` Step 0
  category: schema/file format/storage layout
  rationale: verify Check 6 reads these fields and its absent-key path is a silent
    PASS, so two units implementing this differently kill the gate with no error
  source: spec
- id: IRR-004
  decision: a new public CLI verb `hm spec_need frontmatter-upsert` owns the presence-preserving
    PLAN frontmatter write
  category: public API/CLI contract
  rationale: rendered stages in user harnesses call it by name, so its name and signature
    are a contract; AC-002's property oracle over arbitrary prior frontmatter states
    requires an execution surface that a prose recipe cannot provide
  source: execute
