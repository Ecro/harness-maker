schema_version: 3
spec_slug: plan-stage-absorption
parent_spec: null
verification_tier: 1
mutation_threshold: 85
mutation_threshold_rationale: 'Tier-1: the pipeline migration rewrites user configuration
  in place and the enum removal decides whether an existing harness loads at all.
  A surviving mutant in the drop predicate leaves `plan` in the pipeline so autopilot
  advances to a stage that no longer renders; one in the advisory guard warns on every
  load or never; one in the stage-name tuple silently re-admits the deleted stage.
  spec_need.py joins the set with IRR-004: a surviving mutant in the presence-preserving
  write silently overwrites a verdict the DRI already recorded.'
