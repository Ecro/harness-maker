[project]
name = "harness-maker"
version = "0.51.2"
description = "Per-project AI coding harness for Claude Code · Cursor · Codex. Profiler + 10-dim interview build a different harness for every project."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ecro", email = "e839638@gmail.com" }]
keywords = [
    "claude-code",
    "cursor",
    "codex",
    "harness",
    "autoloop",
    "anti-rot",
    "code-review",
    "consensus",
    "block-merge",
    "worktree",
    "observability",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3",
    "pyyaml>=6",
    "pydantic>=2",
    "anthropic",
    "httpx",
    "typer",
    "rich",
]

[project.urls]
Homepage = "https://github.com/Ecro/harness-maker"
Repository = "https://github.com/Ecro/harness-maker"
Issues = "https://github.com/Ecro/harness-maker/issues"
"한국어 README" = "https://github.com/Ecro/harness-maker/blob/main/README.ko.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "respx>=0.20",
    "mutmut>=2.4,<3",  # 3.x rewrote the CLI/config (dropped --paths-to-mutate); staying on 2.x — see PLAN-mutmut-3x-pin
    "pre-commit>=4.6.0",
    "hypothesis>=6.100",  # property ACs (spec-tetrad ADR-001) — delivery_metrics AC-005/006
]

[project.scripts]
harness-maker = "harness_maker.cli:main"
hm = "harness_maker.hm:main"

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "advisory: ADVISORY test — per PLAN-install-cmd-cifence ADR-002, run as a separate CI step with `continue-on-error: true` so unrelated external-tool drift (codex CLI behavior, npm registry availability) cannot block CI. Use `-m advisory` to select; `-m \"not advisory\"` to exclude.",
    "slow: long-running test (e.g. delivery-metrics 2000-commit perf gate) — BLOCKING in CI; deselect locally with `-m \"not slow\"` when iterating.",
    "live_env: opt OUT of the root conftest's Claude-session env pin (CLAUDECODE / CLAUDE_ENV_FILE / HM_SESSION_ID). Only for tests whose subject IS the ambient environment; everything else must stay deterministic regardless of whether pytest runs inside a Claude Code session.",
]
