[project]
name = "harness-maker"
version = "0.1.0"
description = "Project-tailored Claude Code harness generator with anti-rot, monitoring, and autoloop integration"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "noel" }]
dependencies = [
    "jinja2>=3",
    "pyyaml>=6",
    "pydantic>=2",
    "anthropic",
    "httpx",
    "feedparser",
    "typer",
    "rich",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
