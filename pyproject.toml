[project]
name = "harness-maker"
version = "0.5.1"
description = "Project-tailored Claude Code harness generator. Grade-gated review + auto-fix, multi-reviewer consensus, edit-preserving block-merge upgrades, anti-rot crawlers, worktree isolation, version-drift detection, and a 3-layer ai-readiness rubric with ranked improvement actions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "noel" }]
dependencies = [
    "jinja2>=3",
    "pyyaml>=6",
    "pydantic>=2",
    "anthropic",
    "httpx",
    "feedparser",
    "typer",
    "rich",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "respx>=0.20",
]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
