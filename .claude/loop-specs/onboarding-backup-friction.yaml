mode: feature
objective: >-
  Audit brownfield in-place preservation; close hooks.json + TOML + sh
  always-REPLACE gaps; auto-gitignore .backup-*/; add harness-maker
  prune-backups CLI. Per PLAN-onboarding-backup-friction.md (7 ADRs,
  validator NEEDS_REVISION_RESOLVED).
target: ""
convergence: all-features-completed
context_ref: work-docs/loop-context/onboarding-backup-friction.yaml
features:
  - name: phase-0-audit-matrix
    acceptance_criteria:
      - "docs/reference/preservation-matrix.md created with the file-type x preservation-outcome matrix from PLAN §Current State, expanded with per-cell status and known-limitation notes"
      - "tests/unit/test_preservation_matrix.py created with parametrized cells; TOML/sh cells marked pytest.mark.xfail(strict=True, reason='Phase 2 not yet landed')"
      - "Hooks.json cells assert desired (Phase 1+3 post-condition) behavior; cells assert RED in Phase 0"
      - "Phase 0 commit: matrix doc + RED tests only; no production code"
  - name: phase-1-3-hooks-merge-atomic
    acceptance_criteria:
      - "src/harness_maker/models.py adds ReconcileDecision.MERGE_JSON enum value"
      - "src/harness_maker/reconcile.py literal-match condition extended to include .codex/hooks.json; all three hooks.json paths map to MERGE_JSON (was REPLACE)"
      - "src/harness_maker/render.py adds _merge_hooks_json(existing, new_data, schema) with schema-aware discriminator per ADR-006"
      - "Render dispatch updated: _is_hooks_json + _is_codex_hooks_json + .cursor/mcp.json three-predicate; .cursor/mcp.json retains pure-render path"
      - "Manifest records merged file's SHA-256 hash (not template-only) so sweep_orphans classifies merged file as ours-clean"
      - "src/harness_maker/cli.py builds merge_json_paths set from conflicts, threads to render()"
      - "tests/unit/test_render.py: per-schema cases (Claude nested, Codex nested, Cursor flat) + matcher-less events (Stop, SessionStart, PermissionRequest, preCompact) + malformed JSON fallback"
      - "tests/unit/test_reconcile.py: .codex/hooks.json + all three hooks.json paths produce MERGE_JSON"
      - "Phase 1+3 ships as ONE atomic commit-series — no intermediate state where literal-match exists without merge logic"
  - name: phase-2-toml-sh-markers
    acceptance_criteria:
      - "src/harness_maker/block_merge.py detect_marker_style() extended to return MarkerStyle.HASH_COMMENT for .toml and .sh suffixes"
      - "parse_segments() style parameter is NOT modified (already exists at block_merge.py:172)"
      - "src/harness_maker/reconcile.py TOML branch and sh branch call detect_marker_style + check has_markers; MERGE_BLOCK when both sides markered, else REPLACE"
      - "tests/unit/test_block_merge.py: detect_marker_style('.toml') → HASH_COMMENT, detect_marker_style('.sh') → HASH_COMMENT, regression assert detect_marker_style('.md') still HTML_COMMENT"
      - "tests/unit/test_preservation_matrix.py: TOML/sh xfail markers removed; cells now pass"
      - "Round-trip test: write .codex/config.toml with # @hm:user:start block, re-render, block survives"
  - name: phase-4-gitignore-wiring
    acceptance_criteria:
      - "src/harness_maker/cli.py calls _ensure_gitignore_entry(target_root, '.backup-*/') after backup()"
      - "_ensure_gitignore_entry helper accessible from CLI (either via worktree.py import or move to io_utils.py)"
      - "tests/unit/test_cli.py: .backup-*/ appears in project_root/.gitignore after brownfield /hm:make; idempotent on second run; respects user's existing !.backup-*/ un-ignore directive"
  - name: phase-5-prune-backups-cli
    acceptance_criteria:
      - "src/harness_maker/cli.py adds prune_backups Typer command with --keep-last N=5, --keep-days D=14, --apply (default False)"
      - "Dry-run lists candidate .backup-*/ dirs + total disk savings; --apply rmtree's them atomically"
      - "Keep window semantics: keep if (rank ≤ N) OR (age ≤ D days); union not intersection"
      - "tests/unit/test_cli.py: dry-run correctness, --apply deletes, empty backup-set graceful, invalid flag combos rejected"
  - name: phase-6-make-prose
    acceptance_criteria:
      - "commands/make.md §4.3 (Safety receipt preview) and §3 (Update branch) reference docs/reference/preservation-matrix.md and harness-maker prune-backups"
      - "tests/unit/test_onboarding_ux_contract.py: required_strings extended with 'docs/reference/preservation-matrix.md' and 'harness-maker prune-backups'; existing strings preserved"
      - "uv run pytest tests/unit/test_onboarding_ux_contract.py::test_make_command_explains_receipt_safety_boundaries -v green"
  - name: phase-7-e2e-on-disk
    acceptance_criteria:
      - "tests/e2e/test_preservation_e2e.py created: per-target (claude-code, cursor, codex) on-disk preservation round-trip scenarios"
      - "Gated by INTEGRATION=1 per project policy"
      - "Manual IDE-acceptance checklist additions noted in tests/cursor-compat/MANUAL_CHECKLIST.md — flagged at loop close as deferred (Success Criterion #9)"
