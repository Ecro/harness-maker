mode: feature
objective: "harness-maker 0.7.1 cleanup — close all deferred P1+P2 findings + version bump"
target: ""
convergence: all-features-completed
context_ref: work-docs/loop-context/plan-0-7-1-cleanup.yaml
features:
  - name: "Phase 0: metrics.jsonl daily rotation + shared tail-read helper"
    acceptance_criteria:
      - "src/harness_maker/_metrics_io.py 신규 — iter_recent_entries(obs_dir, days=7, event=None) 구현"
      - "telemetry.py 가 metrics-YYYY-MM-DD.jsonl 로 일별 작성"
      - "legacy metrics.jsonl 도 reader 가 fallback 으로 인식"
      - "security_scanner._load_recent_tool_calls + cache_diagnostics.diagnose_cache 가 helper 사용"
      - "uv run pytest tests/unit/test_telemetry.py tests/unit/test_cache_diagnostics.py tests/unit/test_security_scanner.py -v 전체 pass"
      - "test_metrics_io_glob_orders_newest_first 신규 test pass"
  - name: "Phase 1: telemetry cwd env-var precedence"
    acceptance_criteria:
      - "telemetry.py main() 의 cwd resolution 이 CLAUDE_PROJECT_DIR → CURSOR_PROJECT_DIR → workspace.current_dir → os.getcwd 순"
      - "stdin data.cwd 는 resolution chain 에서 완전 제거"
      - "test_cwd_precedence_ignores_stdin_cwd 신규 pass — stdin cwd=/etc 입력 시 resolved path 가 /etc 아님"
      - "기존 test_telemetry.py 모두 pass"
  - name: "Phase 2: tool_input whitelist persistence"
    acceptance_criteria:
      - "telemetry.py _build_entry 가 raw_input 을 _ALLOWED_TOOL_INPUT_KEYS={path, file_path, command, target, database, url, query} 로 projection"
      - "각 string value 256 char cap"
      - "security_scanner._load_recent_tool_calls 의 try/JSONDecodeError continue 제거 (persisted JSON 항상 valid)"
      - "test_tool_input_whitelist_drops_secrets 신규 pass"
  - name: "Phase 3: drift_monitor Python contract fence"
    acceptance_criteria:
      - "DriftMonitor.score() 가 baseline_text 를 <baseline>...</baseline>, current_text 를 <current>...</current> 로 wrap 후 judge_drift 호출"
      - "fence-escape 적용 (literal </baseline>, </current> 정화)"
      - "templates/agents/trajectory-monitor.md.j2 의 중복 'wrap in XML' prose 제거"
      - "test_drift_score_wraps_baseline_in_fence 신규 pass"
  - name: "Phase 4: hallucination pure-filesystem check + lru_cache"
    acceptance_criteria:
      - "_is_available 이 importlib.util.find_spec 대신 sys.path 순회로 (p / pkg / __init__.py).is_file() 체크"
      - "@functools.lru_cache(maxsize=512) 적용 (Perf PF4 closure)"
      - "test_hallucination_no_import_side_effects 신규 pass — fake .pth + side-effect import 가 실행 안 됨 확인"
      - "uv run pytest tests/unit/test_hallucination_gate.py -v 전체 pass"
  - name: "Phase 5: _locking threading.local depth counter"
    acceptance_criteria:
      - "memory/_locking.py 에 _LOCK_DEPTH = threading.local() 추가"
      - "exclusive_lock 이 같은 lock_path 재진입 시 yield without flock"
      - "test_exclusive_lock_reentrant_no_deadlock 신규 pass"
  - name: "Phase 6: hallucination guarded_lines walks except handlers"
    acceptance_criteria:
      - "scan_file 의 try walking 이 node.handlers[*].body 도 포함"
      - "test_guarded_import_in_except_handler 신규 pass — except ImportError: import b 가 P2 (guarded) tag"
      - "기존 test_hallucination_gate.py 모두 pass"
  - name: "Phase 7: scan_sequence O(n*window) → O(n) sliding deque"
    acceptance_criteria:
      - "scan_sequence 가 collections.deque(maxlen=window) 로 sliding window 구현"
      - "test_scan_sequence_constant_time_per_call 신규 pass — deque size invariant 확인"
      - "기존 test_prod_name_guard.py 모두 pass"
  - name: "Phase 8: cache_diagnostics + security_scanner share tail-read helper"
    acceptance_criteria:
      - "diagnose_cache 와 _load_recent_tool_calls 가 모두 _metrics_io.iter_recent_entries 사용"
      - "두 함수에 read_text(...).splitlines() 잔재 없음"
      - "uv run pytest tests/unit/test_cache_diagnostics.py tests/unit/test_security_scanner.py -v pass"
  - name: "Phase 9: tool_input partial-secret redaction"
    acceptance_criteria:
      - "telemetry _build_entry 가 _SECRET_PATTERNS 리스트로 known-secret regex (sk-/ghp_/AKIA/Bearer) 매칭 후 [REDACTED] 치환"
      - "redaction 이 256-char cap 이전에 적용"
      - "test_tool_input_redacts_known_secret_patterns 신규 pass"
  - name: "Phase 10: EpisodicStore.read_all max_days parameter"
    acceptance_criteria:
      - "EpisodicStore.read_all 이 max_days: int | None = 30 keyword arg 수용"
      - "max_days 설정 시 sorted desc 후 first N 만 iterate"
      - "test_read_all_max_days_limit 신규 pass — 60일치 fixture 에서 max_days=7 결과 확인"
  - name: "Phase 11: SemanticStore.write_many bulk helper"
    acceptance_criteria:
      - "SemanticStore.write_many(entries) 가 lock 1번만 acquire"
      - "test_write_many_single_lock_acquisition 신규 pass — instrument 로 lock 호출 횟수 측정"
      - "기존 test_semantic.py 모두 pass"
  - name: "Phase 12: Concurrency test fixtures: timeout extend + is_alive check"
    acceptance_criteria:
      - "test_episodic, test_tool_cascade, test_semantic, test_profile 의 4 concurrency test 가 p.join(timeout=60)"
      - "각 test 에 assert not p.is_alive() 추가 (exitcode 검사 전에)"
      - "uv run pytest tests/unit/test_memory tests/unit/test_tool_cascade.py -v 전체 pass"
  - name: "Phase 13: Lock file lifecycle documentation"
    acceptance_criteria:
      - "memory/_locking.py module docstring 에 'Lock files are permanent sentinels by design...' 정책 추가"
      - "코드 변경 없음 — docstring only"
  - name: "Phase 14: Read-staleness docstring contract"
    acceptance_criteria:
      - "SemanticStore.read_all + search docstring 에 staleness 계약 추가"
      - "ProfileStore.get + get_all docstring 에 동일 계약 추가"
      - "코드 변경 없음 — docstring only"
  - name: "Phase 15: Version bump 0.7.0 → 0.7.1 + release notes"
    acceptance_criteria:
      - ".claude-plugin/plugin.json version: 0.7.1"
      - ".cursor-plugin/plugin.json version: 0.7.1"
      - "pyproject.toml version: 0.7.1"
      - "src/harness_maker/__init__.py __version__: 0.7.1"
      - "tests/e2e/sandbox/.claude/harness.yaml + sandbox-plugin-test/.claude/harness.yaml stamps 0.7.1 refresh"
      - "CHANGELOG entry (or release notes md) 가 각 closed REVIEW finding ID 를 reference"
      - "snapshot regen 후 모든 tests/snapshot pass"
      - "grep -r '0.7.0' .claude-plugin .cursor-plugin pyproject.toml src/harness_maker/__init__.py | wc -l == 0"
      - "uv run pytest -q 전체 pass + ruff check + mypy --strict clean"
