  evidence:
  - text: 'verified during the assumption-entry-and-evidence-locator review: autopilot_caps
      calls world.derive(loaded, raw) and reads only approval_valid'
    observed_at: '2026-09-18T21:54:00Z'
    relation: confirms
    locator:
      path: src/harness_maker/autopilot_caps.py
      lines:
      - 316
      - 318
      fingerprint: 0046f96eb439b879d96f5dfaac80b4b967ba141aa1833d57042b79138d889e68
      k: 3
  history: []
- id: verification_marker_is_not_evidence
  claim: A fresh verification-cache marker asserts that a fingerprint is unchanged,
    not that the suite ran or passed; the two diverge silently.
  status: confirmed
  evidence:
  - text: 'Observed 2026-09-20: a wrapup accepted a fresh marker and skipped the suite,
      landing tests/unit/test_land_hold.py on main in a state that could not be COLLECTED
      - the module raised at import so the suite aborted rather than reporting a failure,
      and it sat on main until an unrelated task ran the suite. The commit changed
      both source and tests, which the cache claims to invalidate on.'
    observed_at: '2026-09-20T09:40:00Z'
    relation: confirms
    locator:
      path: src/harness_maker/observability/verification_cache.py
      lines:
      - 352
      - 372
      fingerprint: 0d5a2472857ffa2b23b4f118473fefcfbbdee5e7ce53da2bfdf502e152e5064b
