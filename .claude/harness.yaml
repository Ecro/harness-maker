      test: "uv run pytest -q {path}"
      lint: "uv run ruff check {path}"
      types: "uv run mypy {path}"

reviewers:
  # Routing narrows the OPTIONAL reviewers (ux-reviewer, performance-reviewer) only.
  # The mandatory lenses — design, functionality, robustness, consistency, security, concurrency, tests —
  # are exercised every round regardless of `routing`; incomplete coverage blocks
  # approval, so a routed-away mandatory lens would make every review unapprovable.
  consensus: cross-check
  verbosity: standard
  auto_fix: true
  grade_threshold: A
  max_review_rounds: 3
  # Repair-round re-review gate: below this fraction of a touched file's LOC the
  # round skips its re-review and records the measured ratio as the reason.
  # Set the gate false to restore the pre-gate behaviour in one line.
  rereview_churn_gate: true
  rereview_churn_ratio: 0.3

  installed:
    - code-reviewer
    - security-reviewer
    - security-auditor
    - performance-reviewer
    - ux-reviewer
    - concurrency-reviewer
    - consensus-arbiter
    - executor
    - autoloop-coder
  enabled:
