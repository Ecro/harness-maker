name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Mirrors release.yml's quality-gate job by design (see release.yml lines
# 19–21 — the release-time quality-gate intentionally duplicates ci.yml so a
# slow regression between the last CI run and the tag push cannot reach
# PyPI). Steps below MUST stay byte-identical to release.yml:quality-gate
# (excluding the INTEGRATION step — that runs nightly + at tag time only).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Pytest
        run: uv run pytest -x --tb=short

  dependency-review:
    # Runs only on PRs — blocks introduction of vulnerable transitive deps.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
