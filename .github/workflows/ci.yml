name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Mirrors release.yml's quality-gate job by design (see release.yml lines
# 19–21 — the release-time quality-gate intentionally duplicates ci.yml so a
# slow regression between the last CI run and the tag push cannot reach
# PyPI). Steps below MUST stay byte-identical to release.yml:quality-gate
# (excluding the INTEGRATION step — that runs nightly + at tag time only).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src tests
      # `hm test_runners plan` calls pytest "the only common runner that is SERIAL by default,
      # the one place `-n` is the whole win rather than a tweak". It also warns that a suite
      # only ever run in parallel hides order- and isolation-dependent failures; the job that
      # answers that warning is now `release.yml:quality-gate`, the last serial full-suite run
      # in CI. Nightly is parallel too — its comment explains the trade.
      #
      # Why this changed: run 32377369255 hit the 15m cap. It was not a step-change — the six
      # successful runs before it took 812/837/850/814/884/846s against a 900s cap, so the
      # remaining headroom (16-88s) had been smaller than the run-to-run spread (72s) for weeks.
      # Raising `timeout-minutes` buys time until the next commit; this attacks the cause.
      #
      # `--dist loadfile` is load-bearing, not tuning: tests here touch cwd, temp paths and git
      # refs, and `--dist load` would spread one file's tests across workers and let them race.
      # `-n` stays on the command line rather than in `addopts`: `uv run pytest` with no flags
      # must stay a genuine serial run, both locally and in release.yml, which passes no flags.
      #
      # Measured (14-core WSL2, so read the RATIO, not the seconds): serial did not finish
      # inside 1800s; `-n 4 --dist loadfile -m "not advisory"` finished in 331s with zero
      # failures; `-n auto` at 14 workers took 333s. Equal times at 4 and 14 workers means the
      # suite is bound by subprocess and filesystem waiting, not cores — which is why a 4-vCPU
      # runner is expected to see the same kind of win.
      - name: Pytest
        run: uv run pytest -x --tb=short -n auto --dist loadfile

  dependency-review:
    # Runs only on PRs — blocks introduction of vulnerable transitive deps.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  install-cmd-regression:
    # ADR-001 Q4 trigger (3rd recurrence 2026-05-22): mechanical defense
    # against the "README overpromises IDE parity" failure class. Positive
    # install tests + README lint = BLOCKING; codex negative test = ADVISORY
    # (separate step with continue-on-error per ADR-002 Round 2). Job runs
    # after quality-gate to avoid burning CI minutes on broken commits.
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install codex CLI (for negative ADVISORY test)
        # Pinned version (supply-chain hardening — REVIEW security P1-1,
        # 2026-05-23): unpinned `npm install -g @openai/codex` would execute
        # whatever resolves to `latest` on every PR build, including a
        # compromised future version. Pin to the version the advisory test's
        # expectation was verified against; updating this pin is a deliberate
        # review-gated step.
        #
        # Bumped 0.133.0 -> 0.144.4 on 2026-07-25. It had been stale since
        # 2026-07-15, when the advisory test flipped to expecting `plugin add`
        # to SUCCEED (codex >= 0.144.x clones the repo) while CI kept
        # installing 0.133.0, where it still errors "not found in
        # marketplace". Because the step is continue-on-error, CI stayed green
        # for 10 days with the test failing underneath. The pin must stay in
        # lockstep with `_install_helpers.CODEX_CLI_PINNED_VERSION`, which
        # `test_ci_codex_pin_matches_the_verified_version` enforces as a
        # BLOCKING check.
        # NO continue-on-error (REVIEW security P1-2): a failing install IS
        # a signal worth surfacing. The advisory test consuming this binary
        # has its own `shutil.which("codex")` skip-guard which handles the
        # "codex absent" case; that's a separate failure mode from "install
        # itself broke" (which we want to know about).
        run: npm install -g @openai/codex@0.144.4
      - name: Run BLOCKING install-cmd tests
        # Positive PyPI install + Cursor git-clone + README lint allowlist.
        # `-m "not advisory"` excludes the codex negative test from this step.
        env:
          INSTALL_CMD_TEST: "1"
        run: |
          uv run pytest tests/integration/test_readme_install_commands.py \
            -v -m "not advisory" --tb=short
      - name: Run ADVISORY codex negative test
        # Verifies codex marketplace install still fails as README documents.
        # `continue-on-error: true` per ADR-002 Round 2 amend — external codex
        # CLI behavior changes (or npm install failures upstream) must not
        # block CI; surfaces as a workflow warning instead.
        env:
          INSTALL_CMD_TEST: "1"
        continue-on-error: true
        run: |
          uv run pytest tests/integration/test_readme_install_commands.py \
            -v -m advisory --tb=short
