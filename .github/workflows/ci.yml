name: ci

on:
  pull_request:
  push:
    branches:
      - main

# quality-gate runs the same steps as release.yml:quality-gate (release re-tests the tagged
# commit before anything is published). Both split pytest into three file shards that run in
# parallel (SPEC-ci-shard-serial-nightly): on one 4-vCPU runner the suite was CPU-bound at
# ~12 min, the repository is public so extra runners cost nothing, and waiting was the only
# cost. The one serial full-suite run moved to nightly.yml. The `boundary` job runs the
# INTEGRATION=1 boundary suite on every PR and push to main (SPEC-pr-boundary-gate).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # Every shard reports its own failures instead of being cancelled by the first red one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # tests/conftest.py keeps only the test files that hash to this shard. The pytest `run:`
      # line below carries no shard argument on purpose: `verification_plan` derives the local
      # gate from it, so `hm check` and a bare `uv run pytest` still run the whole suite.
      HM_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      # Ruff, format and mypy (~20 s) run in every shard, so each shard is a complete gate and
      # the steps need no `if:`.
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src tests
      # `--dist loadfile` is load-bearing, not tuning: tests here touch cwd, temp paths and git
      # refs, and `--dist load` would spread one file's tests across workers and let them race.
      # The shards split by file too, for the same reason. `-n` stays on the command line rather
      # than in `addopts`, so a bare `uv run pytest` is still a genuine serial run (nightly's).
      - name: Pytest
        run: uv run pytest -x --tb=short -n auto --dist loadfile

  quality-gate-summary:
    # One check under the old name, green only when every shard passed, so anything that
    # waits on `quality-gate` (a required check, an agent reading the PR) keeps its meaning.
    # The `if:` is load-bearing: a job skipped because a need failed reports success, so the
    # summary must run after a failed shard. `!cancelled()` rather than `always()`, so a run that
    # `cancel-in-progress` superseded does not leave a red `quality-gate` behind.
    # A cancelled run leaves the summary skipped, which GitHub counts as passing for a required
    # check; switch back to `always()` if `quality-gate` is ever made required.
    name: quality-gate
    needs: quality-gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All shards passed
        env:
          RESULT: ${{ needs.quality-gate.result }}
        run: |
          echo "quality-gate shards: $RESULT"
          test "$RESULT" = "success"

  boundary:
    # SPEC-pr-boundary-gate: since autotag a merge to main is a publish, so the boundary suite
    # (what Claude Code / Codex actually parse and load) must run before merge, not only in
    # release.yml:boundary-advisory after the Release exists. BLOCKING. The two live tests
    # (Maker default permissions, bench resume) skip when `claude` is not on PATH, as here;
    # the session opening the PR runs them locally.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Same checkout as release.yml:boundary-advisory, so both runs see the same tree.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Boundary tests
        env:
          INTEGRATION: "1"
        run: uv run pytest tests/integration/test_boundary_*.py -v --tb=short

  dependency-review:
    # Runs only on PRs — blocks introduction of vulnerable transitive deps.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  install-cmd-regression:
    # ADR-001 Q4 trigger (3rd recurrence 2026-05-22): mechanical defense
    # against the "README overpromises IDE parity" failure class. Positive
    # install tests + README lint = BLOCKING; codex negative test = ADVISORY
    # (separate step with continue-on-error per ADR-002 Round 2). Job runs
    # in parallel with quality-gate: the old `needs:` only saved CI minutes, which are free
    # on this public repository, and made the job finish 13 minutes late.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install codex CLI (for negative ADVISORY test)
        # Pinned version (supply-chain hardening — REVIEW security P1-1,
        # 2026-05-23): unpinned `npm install -g @openai/codex` would execute
        # whatever resolves to `latest` on every PR build, including a
        # compromised future version. Pin to the version the advisory test's
        # expectation was verified against; updating this pin is a deliberate
        # review-gated step.
        #
        # Bumped 0.133.0 -> 0.144.4 on 2026-07-25. It had been stale since
        # 2026-07-15, when the advisory test flipped to expecting `plugin add`
        # to SUCCEED (codex >= 0.144.x clones the repo) while CI kept
        # installing 0.133.0, where it still errors "not found in
        # marketplace". Because the step is continue-on-error, CI stayed green
        # for 10 days with the test failing underneath. The pin must stay in
        # lockstep with `_install_helpers.CODEX_CLI_PINNED_VERSION`, which
        # `test_ci_codex_pin_matches_the_verified_version` enforces as a
        # BLOCKING check.
        # NO continue-on-error (REVIEW security P1-2): a failing install IS
        # a signal worth surfacing. The advisory test consuming this binary
        # has its own `shutil.which("codex")` skip-guard which handles the
        # "codex absent" case; that's a separate failure mode from "install
        # itself broke" (which we want to know about).
        run: npm install -g @openai/codex@0.144.4
      - name: Run BLOCKING install-cmd tests
        # Positive PyPI install + README lint allowlist.
        # `-m "not advisory"` excludes the codex negative test from this step.
        env:
          INSTALL_CMD_TEST: "1"
        run: |
          uv run pytest tests/integration/test_readme_install_commands.py \
            -v -m "not advisory" --tb=short
      - name: Run ADVISORY codex negative test
        # Verifies codex marketplace install still fails as README documents.
        # `continue-on-error: true` per ADR-002 Round 2 amend — external codex
        # CLI behavior changes (or npm install failures upstream) must not
        # block CI; surfaces as a workflow warning instead.
        env:
          INSTALL_CMD_TEST: "1"
        continue-on-error: true
        run: |
          uv run pytest tests/integration/test_readme_install_commands.py \
            -v -m advisory --tb=short
