name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Always dry run — workflow_dispatch is build/test only; publish requires a v* tag push"
        type: boolean
        default: true

# Trusted Publisher subject (must match PyPI / TestPyPI registration):
#   repository:  Ecro/harness-maker
#   workflow:    release.yml
#   environment: testpypi (for TestPyPI), pypi (for PyPI)
#
# The quality-gate job duplicates ci.yml's lint/type/test on purpose — it
# re-runs at tag time so a slow regression between the last CI run and the
# tag push cannot reach PyPI.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src tests
      - name: Pytest
        run: uv run pytest -x --tb=short
      - name: Integration test — fresh install readiness
        # PLAN-fresh-install-health-baseline Phase 5: gate the release on the
        # integration test that exercises Side+Production fresh-install
        # readiness + existing-install migration via existing render
        # semantics + byte-identical idempotency. CI for PR triggers was
        # removed (565d7ce); this is the canonical gate.
        env:
          INTEGRATION: "1"
        run: uv run pytest tests/integration/test_fresh_install_readiness.py -x --tb=short

  build:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Build wheel + sdist
        run: uv build --out-dir dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    needs: [build]
    # Publishing is tag-only — workflow_dispatch never reaches this job.
    # This prevents an OIDC-authenticated publish from any branch ref.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Show Trusted Publisher subject (for audit)
        run: |
          echo "Trusted Publisher subject:"
          echo "  repository:  ${GITHUB_REPOSITORY}"
          echo "  workflow:    release.yml"
          echo "  environment: testpypi"
          echo "  ref:         ${GITHUB_REF}"
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*
      - name: Smoke install from TestPyPI
        timeout-minutes: 5
        run: |
          uv venv /tmp/testpypi-venv
          uv pip install harness-maker \
            --python /tmp/testpypi-venv/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/
          /tmp/testpypi-venv/bin/harness-maker --help

  publish-pypi:
    needs: [publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Show Trusted Publisher subject (for audit)
        run: |
          echo "Trusted Publisher subject:"
          echo "  repository:  ${GITHUB_REPOSITORY}"
          echo "  workflow:    release.yml"
          echo "  environment: pypi"
          echo "  ref:         ${GITHUB_REF}"
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md (if present).
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN { found = 0 }
              /^##[[:space:]]/ {
                if (found) exit
                if (index($0, ver)) { found = 1; print; next }
              }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${TAG}" > "$NOTES_FILE"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"

  # PLAN-test-fidelity-gap Layer 1 (ADR-004 v2):
  # Boundary-parse tests run as advisory after the Release exists, then
  # append their summary to the Release body via `gh release edit`. They
  # are pure parser tests (json/tomllib/yaml) — no LLM calls, no secrets
  # needed. continue-on-error on both the pytest step and the job ensures
  # publish-pypi / github-release results are never overwritten by a
  # boundary test failure.
  boundary-advisory:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write  # to `gh release edit`
      id-token: none   # explicit denial; this job never publishes (defense-in-depth)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run boundary tests
        id: boundary
        continue-on-error: true
        env:
          INTEGRATION: "1"
        run: |
          set +e
          uv run pytest tests/integration/test_boundary_*.py -v --tb=short 2>&1 | tee /tmp/boundary.txt
          # PIPESTATUS[0] = pytest's exit code (not tee's, which is always 0
          # on successful disk write). Without this, a real boundary failure
          # would be silently reported as PASS in the Release body.
          # (REVIEW-test-fidelity-gap consensus-passed P1.)
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Append boundary results to GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"
          EXIT="${{ steps.boundary.outputs.exit_code }}"
          if [ "$EXIT" = "0" ]; then
            STATUS="✅ PASS"
          else
            STATUS="⚠️ FAIL (advisory — publish already succeeded)"
          fi
          # Strip ANSI escape sequences from pytest -v output so the fenced
          # block renders cleanly on the Release UI.
          SUMMARY="$(tail -30 /tmp/boundary.txt | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g')"
          NEW_NOTES="$(mktemp)"
          # Guard: `gh release view` failure must NOT silently overwrite the
          # original Release notes with the advisory section alone (a partial
          # github-release job or transient gh API failure would otherwise
          # destroy the CHANGELOG-derived notes). Skip the append on fetch
          # failure; the boundary section can be re-added manually later.
          if ! gh release view "$TAG" --json body -q .body > "$NEW_NOTES"; then
            echo "WARNING: could not fetch release body for $TAG — skipping advisory append (notes preserved)" >&2
            exit 0
          fi
          {
            printf '\n\n## Boundary tests (advisory)\n\nLayer 1 of PLAN-test-fidelity-gap. Pure parser checks; advisory only.\n\nStatus: %s\n\n```\n%s\n```\n' "$STATUS" "$SUMMARY"
          } >> "$NEW_NOTES"
          gh release edit "$TAG" --notes-file "$NEW_NOTES"
