name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Always dry run — workflow_dispatch is build/test only; publish requires a v* tag push"
        type: boolean
        default: true

# Trusted Publisher subject (must match PyPI / TestPyPI registration):
#   repository:  Ecro/harness-maker
#   workflow:    release.yml
#   environment: testpypi (for TestPyPI), pypi (for PyPI)
#
# The quality-gate job duplicates ci.yml's lint/type/test on purpose — it
# re-runs at tag time so a slow regression between the last CI run and the
# tag push cannot reach PyPI.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Pytest
        run: uv run pytest -x --tb=short
      - name: Integration test — fresh install readiness
        # PLAN-fresh-install-health-baseline Phase 5: gate the release on the
        # integration test that exercises Side+Production fresh-install
        # readiness + existing-install migration via existing render
        # semantics + byte-identical idempotency. CI for PR triggers was
        # removed (565d7ce); this is the canonical gate.
        env:
          INTEGRATION: "1"
        run: uv run pytest tests/integration/test_fresh_install_readiness.py -x --tb=short

  build:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Build wheel + sdist
        run: uv build --out-dir dist/
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-testpypi:
    needs: [build]
    # Publishing is tag-only — workflow_dispatch never reaches this job.
    # This prevents an OIDC-authenticated publish from any branch ref.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Show Trusted Publisher subject (for audit)
        run: |
          echo "Trusted Publisher subject:"
          echo "  repository:  ${GITHUB_REPOSITORY}"
          echo "  workflow:    release.yml"
          echo "  environment: testpypi"
          echo "  ref:         ${GITHUB_REF}"
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*
      - name: Smoke install from TestPyPI
        timeout-minutes: 5
        run: |
          uv venv /tmp/testpypi-venv
          uv pip install harness-maker \
            --python /tmp/testpypi-venv/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/
          /tmp/testpypi-venv/bin/harness-maker --help

  publish-pypi:
    needs: [publish-testpypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Show Trusted Publisher subject (for audit)
        run: |
          echo "Trusted Publisher subject:"
          echo "  repository:  ${GITHUB_REPOSITORY}"
          echo "  workflow:    release.yml"
          echo "  environment: pypi"
          echo "  ref:         ${GITHUB_REF}"
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md (if present).
          NOTES_FILE="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN { found = 0 }
              /^##[[:space:]]/ {
                if (found) exit
                if (index($0, ver)) { found = 1; print; next }
              }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Release ${TAG}" > "$NOTES_FILE"
          fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
