name: nightly

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:

# Runs the full quality-gate (matches ci.yml steps) PLUS the integration
# test that requires INTEGRATION=1. release.yml:quality-gate duplicates the
# same set at tag time; this workflow catches regressions in the window
# between PR merge and the next release.

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test_deny_literal_prune's `git log -S` oracle needs real history;
          # a shallow clone makes it fail loudly rather than pass vacuously.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src tests
      # Parallel, matching ci.yml. `hm test_runners plan` warns that a suite only ever run in
      # parallel hides order- and isolation-dependent failures, and this job was where that
      # warning was being honoured — for one day.
      #
      # The serial run did not disappear; it moved. `release.yml:quality-gate` still runs
      # `uv run pytest -x --tb=short` with no `-n` (~14 min against a 20-minute cap), so a
      # failure that only appears in a serial ordering now surfaces at TAG time. That is a
      # later signal, and arguably the better place for it: such a failure blocks a release
      # instead of reaching one. It is also the last serial run in CI — parallelising that job
      # too would remove the oracle outright, so do not, and if its cap ever gets tight, add a
      # separate serial job rather than adding `-n` there.
      #
      # `--dist loadfile` keeps each file's tests on one worker, so within-file ordering — where
      # this suite's cwd, temp-path and git-ref coupling actually lives — is preserved either
      # way; only cross-file ordering is given up. `addopts` still has no `-n` so a bare
      # `uv run pytest` stays serial for local runs.
      #
      # What this bought is machine time, not a person's: nightly has a 30-minute cap, finished
      # serially in 810s, and nobody waits on it.
      - name: Pytest
        run: uv run pytest -x --tb=short -n auto --dist loadfile
      - name: Integration test — fresh install readiness
        env:
          INTEGRATION: "1"
        run: uv run pytest tests/integration/test_fresh_install_readiness.py -x --tb=short
